<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Записи занять · Математика до НМТ</title>
<meta name="theme-color" content="#fff3e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,700;1,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --mark:#ff8a00;--mark-d:#e57a00;--mark-ink:#fff;--ink:#2b1906;--muted:#8a6e58;--line:#f5e4d0;
  --soft:#fff3e4;--soft2:#ffe6c7;--surface:#fff;--bg:#fffaf3;--ok:#14a06b;--ok-soft:#e1f6ec;--bad:#d64545;
  --grid:rgba(255,138,0,.08);--shadow:0 18px 40px -22px rgba(255,138,0,.35);--r:22px;
  --f-head:Arial,"Helvetica Neue",system-ui,sans-serif;--f-round:"Nunito",Arial,system-ui,sans-serif;
  --f-display:"Noto Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-head);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 120px}
.hidden{display:none!important}

/* top bar — як на matanschool.com */
.top{position:sticky;top:10px;z-index:30;margin:10px auto 18px;max-width:980px;padding:0 16px}
.bar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#ffe2bf,#fff0de 60%,#ffe9cf);
  border:1px solid #ffd9ad;border-radius:999px;padding:8px 10px 8px 12px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--mark);
  font-style:normal;font-family:var(--f-round);font-weight:900;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{text-decoration:none;padding:9px 15px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.tabs a.on{background:#fff;font-weight:700}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative;flex:none}
.ibtn:hover{background:rgba(255,255,255,.6)}
.ibtn svg{width:22px;height:22px}
.ibtn .dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--mark);color:#fff;
  font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;font-family:var(--f-round)}
.menu-btn{display:none}
@media (max-width:720px){
  .tabs{display:none}.menu-btn{display:grid}.logo span{font-size:15px}.bar .sp{margin-left:auto}
}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(43,25,6,.25);display:none}
.drawer.on{display:block}
.drawer nav{position:absolute;left:0;top:0;bottom:0;width:min(300px,84vw);background:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 40px rgba(0,0,0,.15)}
.drawer nav a{padding:13px 14px;border-radius:14px;text-decoration:none;font-weight:700}
.drawer nav a.on{background:var(--soft);color:var(--mark-d)}
.drawer nav h4{margin:0 0 12px 12px;font-family:var(--f-display);font-size:22px}

h1.page{font-family:var(--f-display);font-size:clamp(28px,5vw,44px);line-height:1.08;margin:8px 0 6px}
h1.page em{color:var(--mark);font-style:italic}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px -24px rgba(120,60,0,.35)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;
  background:var(--mark);color:var(--mark-ink);box-shadow:0 10px 22px -12px rgba(255,138,0,.9);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--mark-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:8px 13px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c9c9;box-shadow:none}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

/* Записи: групи по місяцях */
.rec-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.search input{border:0;outline:0;flex:1;background:transparent;min-width:0}
.groups{display:flex;flex-direction:column;gap:12px}
.group{overflow:hidden}
.ghead{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;width:100%;border:0;background:none;text-align:left}
.gicon{width:42px;height:42px;border-radius:12px;background:var(--mark);color:#fff;display:grid;place-items:center;flex:none}
.gicon svg{width:22px;height:22px}
.gtitle{font-weight:700;font-size:17px}
.gmeta{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.chev{margin-left:auto;transition:transform .2s;color:var(--muted);flex:none;margin-top:10px}
.group.open .chev{transform:rotate(180deg)}
.glist{display:none;border-top:1px solid var(--line);padding:8px}
.group.open .glist{display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;text-decoration:none}
.lrow:hover{background:var(--soft)}
.lplay{width:44px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.lplay svg{width:14px;height:14px}
.lrow b{display:block;font-size:15px}
.lrow small{color:var(--muted);font-size:13px}
.badge{margin-left:auto;font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;background:var(--soft);color:var(--muted);white-space:nowrap;font-family:var(--f-round)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.new{background:#fff;border:1px solid var(--line)}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* Перегляд запису */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;margin:4px 0 12px}
.ltitle{font-family:var(--f-display);font-size:clamp(22px,4vw,32px);line-height:1.15;margin:0 0 6px}
.lmeta{color:var(--muted);font-size:14px;margin-bottom:14px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:6px;background:#fff;border:1px solid var(--line);border-radius:999px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap;color:var(--muted);display:flex;gap:8px;align-items:center}
.seg button.on{background:var(--mark);color:#fff}
.seg button .n{background:rgba(255,255,255,.3);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.seg button:not(.on) .n{background:var(--soft)}
.player{background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;position:relative}
.player video,.player iframe{width:100%;height:100%;display:block;border:0;background:#000}
.player .msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.offrow{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;flex-wrap:wrap}
.offrow .st{color:var(--muted);font-size:14px;flex:1;min-width:150px}
.offrow .st b{color:var(--ok)}
.prog{height:6px;border-radius:3px;background:var(--line);margin:8px 16px 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mark);width:0;transition:width .3s}
.watch{color:var(--muted);font-size:13px;padding:0 16px 14px;font-weight:700}
.parts{padding:18px;margin-top:14px}
.parts h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.parts h3 small{color:var(--muted);font-weight:600;font-size:13px}
.part{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fffdf9;margin-bottom:8px;width:100%;text-align:left}
.part.on{border-color:var(--mark);background:var(--soft)}
.part .lplay{width:60px;height:44px}
.part b{display:block}
.part small{color:var(--muted);font-size:13px}
.doc{padding:0;overflow:hidden}
.doc iframe{width:100%;height:70vh;border:0;display:block;background:#fff}
.doc .bar2{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);z-index:20}
.sticky-cta .in{max-width:948px;margin:0 auto;display:flex;gap:10px}
.sticky-cta .btn{flex:1;padding:16px}
.desc{padding:16px 18px;margin-top:14px;white-space:pre-wrap;color:#4a3420}

/* Календар */
.toggle{display:flex;justify-content:center;margin:0 0 16px}
.toggle div{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px}
.toggle button{border:0;background:none;border-radius:999px;padding:9px 22px;font-weight:700;color:var(--muted)}
.toggle button.on{background:var(--mark);color:#fff}
.cal{padding:18px}
@media (min-width:900px){.calwrap{max-width:720px;margin:0 auto}}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mnav h2{margin:0;font-size:20px;text-align:center}
.mnav h2 small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.mnav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .wd{font-size:13px;color:var(--muted);font-weight:700;padding:6px 0}
.day{aspect-ratio:1;max-height:56px;border:0;background:none;border-radius:50%;font-weight:700;font-size:16px;display:grid;place-items:center;margin:0 auto;width:100%;max-width:56px;position:relative}
.day.out{color:#cdb8a3;font-weight:600}
.day.has{background:var(--soft2)}
.day.has.past{background:#f1e6d8}
.day.today{background:var(--mark);color:#fff}
.day.sel{box-shadow:0 0 0 2px var(--ink) inset}
.day.has::after{content:"";position:absolute;bottom:14%;width:5px;height:5px;border-radius:50%;background:var(--mark)}
.day.today::after{background:#fff}
.legend{display:flex;justify-content:center;gap:16px;margin-top:12px;color:var(--muted);font-size:13px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;background:var(--soft2);display:inline-block}
.legend i.t{background:var(--mark)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.dayhead h3{margin:0;font-size:18px}
.dayhead small{color:var(--muted);font-weight:700}
.ev{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px}
.ev .tm{font-family:var(--f-round);font-weight:900;font-size:18px;color:var(--mark);min-width:56px}
.ev b{display:block}
.ev small{color:var(--muted)}
.ev .btn{margin-left:auto}
.noev{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.list{padding:6px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #d9c3ab;flex:none;display:grid;place-items:center}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chk svg{width:14px;height:14px}
.li .d{font-weight:700;min-width:52px;font-size:15px}
.li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.li.past .t{color:var(--muted);font-weight:600}
.li .tm{color:var(--muted);font-weight:700;font-size:14px}
.li.todayrow{background:var(--soft)}

/* toast, modal */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;font-weight:700;font-size:14px;max-width:min(92vw,520px);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(43,25,6,.35);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal .card{width:100%;max-width:640px;padding:20px}
.modal h3{margin:0 0 14px;font-family:var(--f-display);font-size:22px}

/* адмінка */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mark)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.atabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.atabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.abar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px}
.abar .st{color:var(--muted);font-size:14px;flex:1}
.warn{background:#fff4e0;border:1px solid #ffd59a;color:#7a4b00;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.arow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .d{min-width:92px;font-weight:700;font-size:14px}
.arow .t{flex:1;min-width:0}
.arow .t small{display:block;color:var(--muted)}
.partedit{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin-bottom:6px}
@media (max-width:560px){.partedit{grid-template-columns:1fr auto}.partedit input:nth-child(2){grid-column:1/-1;grid-row:2}}
.wdpick{display:flex;flex-wrap:wrap;gap:8px}
.wdpick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-weight:700}
.wdpick input[type=time]{border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.small{font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
.foot a{color:var(--muted)}
.ava{width:40px;height:40px;border-radius:50%;border:0;background:#8a4b14;color:#fff;font-weight:800;font-family:var(--f-round);flex:none}
.amenu{position:fixed;z-index:70;top:66px;right:max(16px,calc(50% - 474px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.25);padding:8px;min-width:220px}
.amenu .em{padding:8px 12px;color:var(--muted);font-size:13px;word-break:break-all}
.amenu a,.amenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;text-decoration:none}
.amenu a:hover,.amenu button:hover{background:var(--soft)}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.gate .card{width:100%;max-width:420px;padding:26px}
.gate h2{font-family:var(--f-display);font-size:28px;margin:12px 0 6px;line-height:1.1}
.gate h2 em{color:var(--mark)}
.gate .logo i{box-shadow:0 0 0 1px var(--line)}
body.embed .ava{display:none}
body.embed .top{display:none}
body.embed .wrap{padding-top:12px}
</style>
</head>

const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};

const pl=(n,a,b,c)=>{const m=n%10,h=n%100;return n+" "+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)};
const pad=n=>String(n).padStart(2,"0");

const onWeb=/^https?:$/.test(location.protocol);
async function rpc(fn,body){
  const r=await fetch(CLOUD.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CLOUD.key},body:JSON.stringify(body||{})});
  const t=await r.text();if(!r.ok){const e=new Error(r.status+" "+t.slice(0,200));e.status=r.status;throw e}
  return t?JSON.parse(t):null;
}
let DATA=lsGet(LS.data,null)||demoData();

async function loadCloud(){

    if(d&&d.lessons){DATA=d;lsSet(LS.data,d);render()}}

/* ================== Офлайн-відео (IndexedDB) ================== */
const IDB={db:null};
IDB.open=()=>IDB.db||(IDB.db=new Promise((res,rej)=>{const r=indexedDB.open("ms-zap-offline",1);
  r.onupgradeneeded=()=>{const db=r.result;db.createObjectStore("blobs");db.createObjectStore("meta")};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
IDB.tx=async(store,mode,fn)=>{const db=await IDB.open();return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
let OFF={}; // key -> meta
async function loadOff(){try{const db=await IDB.open();await new Promise(res=>{const t=db.transaction("meta");const q=t.objectStore("meta").openCursor();const o={};
  q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else{OFF=o;res()}};q.onerror=()=>res()})}catch(e){}updOffCount()}
function updOffCount(){const n=Object.keys(OFF).length;const el=$("#offCount");el.textContent=n;el.classList.toggle("hidden",!n)}
const offKey=(lid,pi)=>lid+"#"+pi;
const DL={}; // key -> {pct, ctrl}
async function saveOffline(L,pi){
  const p=L.parts[pi];const key=offKey(L.id,pi);if(DL[key])return;
  if(isYT(p.url)){toast("Відео з YouTube не можна зберегти офлайн. Додайте пряме посилання на файл .mp4");return}
  const ctrl=new AbortController();DL[key]={pct:0,ctrl};paintOff();
  try{
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const r=await fetch(p.url,{signal:ctrl.signal});if(!r.ok)throw new Error("HTTP "+r.status);
    const total=+r.headers.get("content-length")||0;let blob;
    if(r.body&&r.body.getReader){const rd=r.body.getReader();const chunks=[];let got=0;
      for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;if(total){DL[key].pct=Math.round(got/total*100);paintOff()}}
      blob=new Blob(chunks,{type:r.headers.get("content-type")||"video/mp4"});
    }else blob=await r.blob();
    const meta={lid:L.id,pi,title:L.title,part:p.title,size:blob.size,url:p.url,saved:Date.now(),date:L.date};
    await IDB.tx("blobs","readwrite",s=>s.put(blob,key));await IDB.tx("meta","readwrite",s=>s.put(meta,key));
    OFF[key]=meta;delete DL[key];updOffCount();toast("Збережено офлайн ✓");render();
  }catch(e){delete DL[key];paintOff();if(e.name!=="AbortError")toast("Не вдалося зберегти: "+(/Failed to fetch|NetworkError|Load failed/.test(e.message)?"сервер з відео не дозволяє завантаження (CORS) або немає інтернету":e.message))}
}
async function removeOffline(key){try{await IDB.tx("blobs","readwrite",s=>s.delete(key));await IDB.tx("meta","readwrite",s=>s.delete(key))}catch(e){}delete OFF[key];updOffCount();render()}
async function offBlobUrl(key){try{const b=await IDB.tx("blobs","readonly",s=>s.get(key));return b?URL.createObjectURL(b):null}catch(e){return null}}
const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+" МБ";

/* ================== Перегляд (прогрес) ================== */
let WATCH=lsGet(LS.watch,{}); // key -> {t, d}
const wpct=k=>{const w=WATCH[k];return w&&w.d?Math.min(100,Math.round(w.t/w.d*100)):0};
function lessonPct(L){if(!L.parts.length)return 0;let s=0;L.parts.forEach((p,i)=>s+=wpct(offKey(L.id,i)));return Math.round(s/L.parts.length)}

const isYT=u=>/youtu\.?be/.test(u||"");
const ytEmbed=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{6,})/);return m?"https://www.youtube.com/embed/"+m[1]+"?rel=0":u};
const gdEmbed=u=>{const m=String(u).match(/drive\.google\.com\/file\/d\/([\w-]+)/);return m?"https://drive.google.com/file/d/"+m[1]+"/preview":u};
const groupOf=L=>L.group||(L.date?MONTHS[parseD(L.date).getMonth()]+(parseD(L.date).getFullYear()!==new Date().getFullYear()?" "+parseD(L.date).getFullYear():""):"Інше");
const fmtDay=s=>{const d=parseD(s);return d.getDate()+" "+MONTHS_G[d.getMonth()]};
function agoText(s){if(!s)return"";const d=Math.floor((new Date().setHours(0,0,0,0)-parseD(s))/864e5);
  if(d<=0)return"оновлено сьогодні";if(d===1)return"оновлено вчора";if(d<31)return"оновлено "+pl(d,"день","дні","днів")+" тому";const x=parseD(s);return"оновлено "+pad(x.getDate())+"."+pad(x.getMonth()+1)+"."+x.getFullYear()}
function recGroups(q){
  const map={};
  lessonsAll().filter(l=>l.parts&&l.parts.length&&(!l.date||isPast(l))).forEach(l=>{
    if(q&&!(l.title+" "+groupOf(l)).toLowerCase().includes(q))return;
    const g=groupOf(l);(map[g]=map[g]||{name:g,items:[],upd:""}).items.push(l);
    const u=l.updated||l.date||"";if(u>map[g].upd)map[g].upd=u;
  });
  const arr=Object.values(map);arr.forEach(g=>g.items.sort((a,b)=>(b.date||b.updated||"").localeCompare(a.date||a.updated||"")));
  return arr.sort((a,b)=>b.upd.localeCompare(a.upd));
}

async function mountPlayer(L,p,key){
  const box=$("#player");if(curVideoUrl){URL.revokeObjectURL(curVideoUrl);curVideoUrl=null}
  if(isYT(p.url)){box.innerHTML=`<iframe src="${esc(ytEmbed(p.url))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;$("#cont").onclick=()=>box.scrollIntoView({behavior:"smooth",block:"center"});return}
  let src=p.url;if(OFF[key]){const u=await offBlobUrl(key);if(u){src=u;curVideoUrl=u}}
  box.innerHTML=`<video controls playsinline preload="metadata"></video>`;
  const v=box.querySelector("video");v.src=src;
  const w=WATCH[key];v.addEventListener("loadedmetadata",()=>{if(w&&w.t&&w.t<v.duration-3)v.currentTime=w.t});
  let last=0;v.addEventListener("timeupdate",()=>{if(!v.duration)return;const now=Date.now();if(now-last<1500)return;last=now;
    WATCH[key]={t:Math.floor(v.currentTime),d:Math.floor(v.duration)};lsSet(LS.watch,WATCH);paintWatch(key)});
  v.addEventListener("ended",()=>{WATCH[key]={t:Math.floor(v.duration),d:Math.floor(v.duration)};lsSet(LS.watch,WATCH);paintWatch(key)});
  v.addEventListener("error",()=>{if(!navigator.onLine&&!OFF[key])box.insertAdjacentHTML("beforeend",`<div class="msg">Немає інтернету. Це відео не збережено офлайн.</div>`)});
  $("#cont").onclick=()=>{box.scrollIntoView({behavior:"smooth",block:"center"});v.play().catch(()=>{})};
  paintWatch(key);
}
function paintWatch(key){const pc=wpct(key),b=$("#wbar"),t=$("#wtxt");if(!b)return;b.style.width=pc+"%";
  const w=WATCH[key];t.textContent=pc>=95?"Переглянуто повністю":pc?`Переглянуто ${pc}% · зупинились на ${Math.floor(w.t/60)}:${pad(w.t%60)}`:"Ще не переглядали"}
function paintOff(){
  if(R.name!=="lesson"||UI.tab!=="video")return;const L=byId(R.args[0]);if(!L||!L.parts.length)return;

function vCalendar(){
  const today=new Date();today.setHours(0,0,0,0);
  if(!UI.month)UI.month=new Date(today.getFullYear(),today.getMonth(),1);
  if(!UI.sel)UI.sel=ymd(today);
  const y=UI.month.getFullYear(),m=UI.month.getMonth();
  const evs=lessonsAll().filter(l=>l.date);const byDate={};evs.forEach(l=>(byDate[l.date]=byDate[l.date]||[]).push(l));
  Object.values(byDate).forEach(a=>a.sort((p,q)=>(p.time||"").localeCompare(q.time||"")));
  const ev=S().eventName||"Урок";
  const nav=(title,sub)=>`<div class="mnav"><button id="pm" aria-label="Попередній місяць">${ICON.left}</button><h2>${title}${sub?`<small>${sub}</small>`:""}</h2><button id="nm" aria-label="Наступний місяць">${ICON.right}</button></div>`;
  let inner="";
  if(UI.calView==="cal"){
    const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
    let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
      if(i===35&&d.getMonth()!==m)break;
      const cls=["day",d.getMonth()!==m?"out":"",byDate[k]?"has":"",byDate[k]&&d<today?"past":"",+d===+today?"today":"",k===UI.sel?"sel":""].join(" ");
      cells+=`<button class="${cls}" data-d="${k}">${d.getDate()}</button>`}
    const sd=parseD(UI.sel),list=byDate[UI.sel]||[];
    inner=`<div class="card cal">${nav(MONTHS_L[m]+" "+y+" р.")}
      <div class="grid7">${["пн","вт","ср","чт","пт","сб","нд"].map(w=>`<div class="wd">${w}</div>`).join("")}${cells}</div>
      <div class="legend"><span><i></i>${esc(ev)}</span><span><i class="t"></i>Сьогодні</span></div></div>
    <div class="dayhead"><h3>${WD_F[sd.getDay()]}, ${fmtDay(UI.sel)}</h3>${+sd===+today?"<small>сьогодні</small>":""}</div>
    ${list.length?list.map(l=>evCard(l)).join(""):`<div class="noev">Цього дня подій немає.</div>`}`;
  }else{
    const ms=evs.filter(l=>{const d=parseD(l.date);return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const done=ms.filter(isPast).length;const tk=ymd(today);
    inner=`<div class="card cal" style="padding-bottom:6px">${nav(`${esc(S().eventsName||"Уроки")} · ${MONTHS_L[m]} ${y} р.`,`Відбулося ${done} з ${ms.length}`)}
      <div class="card list" style="box-shadow:none">${ms.map(l=>{const p=isPast(l),d=parseD(l.date);return`<div class="li ${p?"past":""} ${l.date===tk?"todayrow":""}">
        <span class="chk ${p?"on":""}">${p?ICON.check:""}</span><span class="d">${WD_S[d.getDay()]}, ${d.getDate()}</span>
        <span class="t" title="${esc(l.title)}">${esc(l.title)}</span>
        ${p&&l.parts.length?`<a class="btn sm" href="#/lesson/${encodeURIComponent(l.id)}">${ICON.play.replace('<svg','<svg width="12" height="12"')} Запис</a>`:`<span class="tm">${p?"скоро запис":esc(l.time||"")}</span>`}</div>`}).join("")||`<div class="empty">У цьому місяці уроків немає</div>`}</div></div>`;
  }
  $("#app").innerHTML=`<div class="calwrap"><h1 class="page">Кален<em>дар</em></h1>
  <p class="sub">${schedText()}</p>
  <div class="toggle"><div><button data-v="cal" class="${UI.calView==="cal"?"on":""}">Календар</button><button data-v="list" class="${UI.calView==="list"?"on":""}">Список</button></div></div>
  ${inner}</div>${foot()}`;
  document.querySelectorAll(".toggle button").forEach(b=>b.onclick=()=>{UI.calView=b.dataset.v;lsSet(LS.view,UI.calView);vCalendar()});
  $("#pm").onclick=()=>{UI.month=new Date(y,m-1,1);vCalendar()};$("#nm").onclick=()=>{UI.month=new Date(y,m+1,1);vCalendar()};
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{UI.sel=b.dataset.d;const d=parseD(UI.sel);if(d.getMonth()!==m)UI.month=new Date(d.getFullYear(),d.getMonth(),1);vCalendar()});
}
function schedText(){const w=S().weekdays||{};const ks=Object.keys(w).map(Number).sort((a,b)=>((a+6)%7)-((b+6)%7));
  if(!ks.length)return"Розклад уроків";return "Уроки щотижня: "+ks.map(k=>WD_F[k].toLowerCase()+(w[k]?" о "+w[k]:"")).join(" і ")}
function evCard(l){const p=isPast(l);return`<div class="card ev"><span class="tm">${esc(l.time||"—")}</span><span style="min-width:0"><b>${esc(l.title)}</b>
  <small>${p?(l.parts.length?"Відбувся · є запис":"Відбувся · запис скоро"):"Онлайн-урок"}</small></span>
  ${p&&l.parts.length?`<a class="btn sm" href="#/lesson/${encodeURIComponent(l.id)}">${ICON.play.replace('<svg','<svg width="12" height="12"')} Запис</a>`:""}</div>`}

function aSched(){

    <div class="wdpick">${order.map(k=>`<label><input type="checkbox" data-w="${k}" ${w[k]!=null?"checked":""}> ${WD_F[k]} <input type="time" data-wt="${k}" value="${esc(w[k]||"19:00")}"></label>`).join("")}</div>

    <h3 style="margin:22px 0 6px">Скасувати уроки</h3><p class="small" style="margin:0 0 12px">Видалити всі уроки без запису в цьому проміжку (напр., канікули).</p>
    <button class="btn danger" id="delr">Видалити уроки без запису в проміжку</button></div>`;

    EDIT.lessons.forEach(l=>{if(l.group===old)l.group=nw});EDIT.groups[nw]=EDIT.groups[old]||{note:""};delete EDIT.groups[old];touch();aGroups()});
  document.querySelectorAll("[data-gx]").forEach(inp=>inp.onchange=()=>{const n=names[+inp.dataset.gx];(EDIT.groups[n]=EDIT.groups[n]||{}).note=inp.value.trim();touch()});
  $("#ng").onclick=()=>{const n=(prompt("Назва групи")||"").trim();if(n){EDIT.groups[n]=EDIT.groups[n]||{note:""};touch();aGroups()}};
}
function aSettings(){
  const s=EDIT.settings;
  $("#abody").innerHTML=`<div class="card" style="padding:18px">
    <div class="field"><label>Назва школи (зверху)</label><input id="s1" value="${esc(s.brand||"")}"></div>
    <div class="field"><label>Предмет (мітка на групах)</label><input id="s2" value="${esc(s.subject||"")}"></div>
    <div class="row2"><div class="field"><label>Подія в календарі (однина)</label><input id="s3" value="${esc(s.eventName||"")}" placeholder="Урок"></div>
    <div class="field"><label>Заголовок списку (множина)</label><input id="s4" value="${esc(s.eventsName||"")}" placeholder="Уроки"></div></div></div>`;
  [["s1","brand"],["s2","subject"],["s3","eventName"],["s4","eventsName"]].forEach(([i,k])=>$("#"+i).oninput=e=>{s[k]=e.target.value;touch()});
}
function aBackup(){
  $("#abody").innerHTML=`<div class="card" style="padding:18px">
    <p class="small" style="margin-top:0">Резервна копія всього вмісту одним файлом.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="ex">${ICON.down} Завантажити копію (.json)</button>
    <label class="btn ghost">Відновити з файлу<input type="file" id="im" accept=".json,application/json" hidden></label>
    <button class="btn danger" id="rs">Повернути демо-вміст</button></div>
    ${dirty?`<p style="margin-top:14px"><button class="btn sm ghost" id="disc">Скасувати неопубліковані зміни</button></p>`:""}</div>`;
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(EDIT,null,2)],{type:"application/json"}));a.download="zapysy-"+ymd(new Date())+".json";a.click()};
  $("#im").onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.lessons)throw 0;EDIT=d;touch();toast("Завантажено. Натисніть «Опублікувати»");vAdmin()}catch(x){toast("Файл не підходить")}};
  $("#rs").onclick=()=>{if(!confirm("Замінити весь вміст демо-даними?"))return;EDIT=demoData();touch();vAdmin()};
  const d=$("#disc");if(d)d.onclick=()=>{EDIT=JSON.parse(JSON.stringify(DATA));dirty=false;try{localStorage.removeItem(LS.draft)}catch(e){}vAdmin()};
}


/* ================== Вхід за поштою ================== */
let USER=lsGet(LS.email,null);
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
async function isAdminEmail(em){
  try{const r=await rpc("ms_is_admin",{p_email:em});cloudState="ok";return {admin:!!r,mode:"cloud"}}
  catch(e){return {admin:false,mode:"off"}}
}
function showGate(){
  if(document.body.classList.contains("embed")&&USER)return;
  let g=$(".gate");if(!g){g=document.createElement("div");g.className="gate";document.body.appendChild(g)}
  let step="email",em="",mode="cloud";
  const draw=()=>{g.innerHTML=`<div class="card"><span class="logo"><i>√x</i><span>${esc(S().brand||"Математика до НМТ")}</span></span>
    <h2>${step==="email"?"Записи і <em>календар</em>":"Вхід для <em>адміна</em>"}</h2>
    <p class="sub">${step==="email"?"Введіть пошту, щоб увійти.":"Пошта "+esc(em)+" — адмінська. Введіть пароль."}</p>
    <form id="gf2">${step==="email"?`<div class="field"><label>Пошта</label><input id="ge" type="email" autocomplete="email" inputmode="email" required value="${esc(em)}"></div>`
      :`<div class="field"><label>Пароль</label><input id="gp" type="password" autocomplete="current-password" required></div>`}
    <button class="btn" style="width:100%">${step==="email"?"Увійти":"Увійти як адмін"}</button>
    ${step==="pass"?`<button type="button" class="btn ghost" id="gback" style="width:100%;margin-top:8px">Інша пошта</button>`:""}
    <p class="small" id="gerr"></p></form></div>`;
    const f=$("#gf2");(f.querySelector("input")).focus();
    if(step==="pass")$("#gback").onclick=()=>{step="email";draw()};
    f.onsubmit=async e=>{e.preventDefault();const er=$("#gerr");const btn=f.querySelector(".btn");btn.disabled=true;
      if(step==="email"){em=$("#ge").value.trim().toLowerCase();if(!validEmail(em)){er.textContent="Перевірте пошту";btn.disabled=false;return}
        er.textContent="Перевіряю…";const r=await isAdminEmail(em);mode=r.mode;
        if(r.admin){step="pass";draw();return}
        USER=em;lsSet(LS.email,em);ADM=null;try{localStorage.removeItem(LS.admin)}catch(x){}g.remove();afterLogin();return}
      const pw=$("#gp").value;er.textContent="Перевіряю…";let ok=false;
      try{ok=!!(await rpc("ms_admin_ok",{p_email:em,p_pass:pw}))}catch(x){er.textContent="Немає звʼязку з сервером";btn.disabled=false;return}
      if(!ok){er.textContent="Невірний пароль";btn.disabled=false;return}
      USER=em;lsSet(LS.email,em);ADM={email:em,pass:pw,mode:"cloud"};lsSet(LS.admin,ADM);g.remove();afterLogin()};
  };draw();
}
function afterLogin(){
  const a=$("#ava");a.classList.toggle("hidden",!USER);a.textContent=USER?USER[0].toUpperCase():"";
  document.querySelectorAll(".adm-link").forEach(x=>x.classList.toggle("hidden",!ADM));
  render();
}
function logout(){USER=null;ADM=null;EDIT=null;try{localStorage.removeItem(LS.email);localStorage.removeItem(LS.admin)}catch(e){}
  const m=$(".amenu");if(m)m.remove();afterLogin();showGate()}
function toggleAmenu(){let m=$(".amenu");if(m){m.remove();return}
  m=document.createElement("div");m.className="amenu";m.innerHTML=`<div class="em">${esc(USER||"")}${ADM?" · адмін":""}</div>
    ${ADM?`<a href="#/admin">Адмінка</a>`:""}<a href="#/offline">Збережене офлайн</a><button id="amLo">Вийти</button>`;
  document.body.appendChild(m);$("#amLo").onclick=logout;m.querySelectorAll("a").forEach(x=>x.onclick=()=>m.remove());
  setTimeout(()=>document.addEventListener("click",function h(e){if(!m.contains(e.target)&&e.target.id!=="ava"){m.remove();document.removeEventListener("click",h)}}),0)}

/* ================== Старт ================== */
if(/[?&]embed=1/.test(location.search))document.body.classList.add("embed");
$("#menuBtn").onclick=()=>$("#drawer").classList.add("on");
$("#drawer").onclick=e=>{if(e.target.id==="drawer")$("#drawer").classList.remove("on")};
dirty=!!lsGet(LS.draft,null);
$("#ava").onclick=toggleAmenu;$("#dLogout").onclick=e=>{e.preventDefault();logout()};
if(ADM&&ADM.email!==USER)ADM=null;
afterLogin();if(!USER)showGate();
route();loadOff().then(render);loadCloud();
if(onWeb&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
