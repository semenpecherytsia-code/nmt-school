<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Совиний кошик</title>
<meta name="description" content="Гра: сова ловить хмаринки з правильними виразами">
<style>
/* Layout: a cozy Ukrainian study artbook. Arcade and map live on a painted forest canvas;
   training and the mock exam sit on warm paper with one centred working column. Single light look by design. */
:root{
  --paper:#fff4e8; --paper-2:#ffe9d2; --card:#fffaf4; --ink:#3a2410; --muted:#7a5a3e; --line:#ffd5a8;
  --amber:#ff8a00; --amber-d:#f07a00; --amber-soft:#ffe7cc; --forest:#ff8a00; --forest-d:#c96a00; --forest-soft:#ffecd6;
  --good:#1d7a4f; --good-soft:#dff2e6; --bad:#b3362b; --bad-soft:#fbe3df; --warn:#9a5b00; --warn-soft:#fff0d1;
  --sky:#a9d8f2; --focus:#1f5fbf;
  --f-body:"Segoe UI","Noto Sans","Roboto","Helvetica Neue",Arial,sans-serif;
  --f-head:Georgia,"Noto Serif","Cambria","Times New Roman",serif;
  --f-math:"Cambria Math","Cambria","STIX Two Math","Noto Serif",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
body.paper #world{display:none}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
body.game #view{overflow:hidden;pointer-events:none}
body.game #view>*{pointer-events:auto}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.narrow{max-width:720px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:17px;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--amber);color:#fff;box-shadow:0 6px 16px rgba(255,138,0,.35)}
.btn-forest{background:var(--forest);color:#fff;box-shadow:0 6px 16px rgba(255,138,0,.35)}
.btn-ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-quiet{background:transparent;color:var(--ink);border-color:var(--line);min-height:40px;padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-big{min-height:58px;font-size:20px;border-radius:16px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 160px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:inline-grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.link{background:none;border:0;padding:4px 0;color:var(--forest-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums;min-height:40px}
.pill svg{width:20px;height:20px}
.crumb{display:flex;align-items:center;gap:10px}
.crumb h1,.crumb h2{margin:0}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--f-head);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:clamp(22px,4.5vw,28px)}
h3{font-size:19px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet{background:var(--card);border-radius:22px;box-shadow:0 2px 0 rgba(43,25,6,.06),0 18px 40px rgba(43,25,6,.16);padding:20px;display:flex;flex-direction:column;gap:14px}
.notice{border-radius:14px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);border:2px solid #f0cf8a}
.notice.good{background:var(--good-soft);border:2px solid #a9d7bb}
.notice.bad{background:var(--bad-soft);border:2px solid #efb3aa}
.notice.info{background:var(--forest-soft);border:2px solid #ffc98f}

/* ---------- home ---------- */
.home-hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:6px}
.logo{font-family:var(--f-head);font-size:clamp(34px,8vw,52px);line-height:1;margin:0;color:var(--ink);text-shadow:0 2px 0 rgba(255,250,240,.8)}
.logo b{color:#ff8a00}
.logo small{font-family:var(--f-body);font-size:15px;font-weight:800;background:var(--amber);border-radius:8px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.next{background:var(--card);border:2px solid var(--amber);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.next .txt{flex:1 1 220px;min-width:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;box-shadow:0 4px 0 rgba(43,25,6,.07)}
.mode:hover{border-color:var(--amber)}
.mode .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--amber-soft)}
.mode .ic svg{width:26px;height:26px}
.mode b{font-family:var(--f-head);font-size:21px}
.mode span{color:var(--muted);font-size:14px}
.home-spacer{height:min(26vh,220px)}

/* ---------- arcade map ---------- */
.chapter{display:flex;flex-direction:column;gap:10px}
.chapter h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;align-self:flex-start;color:#ff8a00;background:rgba(255,250,244,.92);border-radius:12px;padding:4px 12px;margin:0}
.chapter h3 .sum{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.lv{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.lv.next-up{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.lv[aria-disabled="true"]{background:#f2e8d6}
.lv .n{font-size:12px;font-weight:800;color:var(--forest-d);letter-spacing:.06em;text-transform:uppercase}
.lv .t{font-weight:800;font-size:17px;line-height:1.2}
.lv .tr{font-size:13px;color:var(--muted)}
.lv .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.lv .go-tag{font-size:12px;font-weight:800;color:#fff;background:var(--amber);border-radius:6px;padding:1px 6px}
.stars{display:inline-flex;gap:2px}
.stars svg{width:20px;height:20px}
.big-stars svg{width:52px;height:52px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:700;font-size:15px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 rgba(43,25,6,.15)}
.setrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.setrow label{font-size:14px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ---------- arcade HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;padding:10px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
.hud-score{order:1}
.hearts{order:1;display:flex;gap:2px;align-items:center}
.hearts svg{width:26px;height:26px}
.hearts .lost{opacity:.22}
.rule{order:2;flex:1 1 320px;background:rgba(255,250,241,.96);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;font-size:clamp(15px,2.3vw,20px);text-align:center}
.rule.flash{animation:flash .7s}
@keyframes flash{0%,100%{background:rgba(255,250,241,.96)}30%{background:var(--amber-soft)}}
.hud-right{order:3;display:flex;gap:8px;margin-left:auto}
.progress{order:4;width:100%;height:8px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--forest);transition:width .25s}
.streak{order:5;font-weight:800;color:#fff;background:var(--amber);border-radius:10px;padding:2px 10px;font-size:14px}
.splash{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));background:var(--card);border:3px solid var(--amber);border-radius:22px;padding:22px;text-align:center;z-index:6;box-shadow:0 16px 40px rgba(20,40,60,.25)}
.splash .eyebrow{margin-bottom:6px}
.splash .big{font-family:var(--f-head);font-size:clamp(24px,5vw,34px);line-height:1.15}
.tutmsg{position:absolute;left:50%;top:var(--tut-top,112px);transform:translateX(-50%);width:min(460px,calc(100% - 32px));background:var(--card);border:2px solid var(--forest);border-radius:16px;padding:12px 14px;font-weight:700;text-align:center;z-index:6}
.calm-bar{position:absolute;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;z-index:6;align-items:center}
.calm-bar .btn-row{width:min(560px,100%)}
.timer-bar{width:min(560px,100%);height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--amber)}
.feedback-live{position:absolute;left:50%;bottom:calc(200px * var(--sc,1));transform:translateX(-50%);font-weight:800;background:var(--card);border-radius:12px;padding:6px 12px;border:2px solid var(--line);z-index:6;white-space:nowrap}

/* ---------- result ---------- */
.result-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tally div{background:var(--paper);border-radius:14px;padding:10px;text-align:center;font-size:14px;color:var(--muted);font-weight:700}
.tally b{display:flex;justify-content:center;align-items:center;gap:6px;font-size:24px;color:var(--ink)}
.tally svg{width:20px;height:20px}
.review-list{display:flex;flex-direction:column;gap:8px}
.rv{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.rv .expr{font-family:var(--f-math);font-size:20px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;border-radius:8px;padding:2px 8px}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.neutral{background:var(--paper-2);color:var(--muted)}

/* ---------- task / training ---------- */
.task{display:flex;flex-direction:column;gap:14px}
.task .stem{font-size:19px;line-height:1.55}
.stem,.opt,.math{font-variant-numeric:lining-nums}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.sys{display:inline-flex;flex-direction:column;border-left:2px solid var(--ink);padding-left:10px;margin:6px 0 6px 6px;border-radius:6px 0 0 6px}
.figwrap{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fig{width:100%;max-width:380px;height:auto}
.figcap{font-size:13px;color:var(--muted);text-align:center}
.fg-line{fill:none;stroke:#2b1906;stroke-width:2.4;stroke-linejoin:round}
.fg-thin{fill:none;stroke:#2b1906;stroke-width:1.4}
.fg-dash{fill:none;stroke:#6b5643;stroke-width:1.6;stroke-dasharray:6 5}
.fg-fill{fill:#fde9bf}.fg-fill2{fill:#f8dca0}.fg-fill3{fill:#f1cf8a}
.fg-grid{stroke:#e3cfae;stroke-width:1}
.fg-axis{stroke:#2b1906;stroke-width:1.8}
.fg-dot{fill:#2b1906}
.fg-pt{fill:#2f6b4a;stroke:#fff;stroke-width:1.5}
.fg-graph{stroke:#2f6b4a;stroke-width:3;fill:none}
.fg-bar{fill:#2f6b4a}
.fg-t{font:600 14px var(--f-body);fill:#2b1906}
.fg-s{font:600 12px var(--f-body);fill:#4b3a2a}
.fg-p{font:italic 700 14px var(--f-head);fill:#2b1906}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:52px;font-size:18px}
.opt .L{flex:none;width:32px;height:32px;border-radius:9px;background:var(--paper-2);display:grid;place-items:center;font-weight:800;font-family:var(--f-body);font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--forest);background:var(--forest-soft)}
.opt[aria-pressed="true"] .L{background:var(--forest);color:#fff}
.opt.is-right{border-color:var(--good);background:var(--good-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .mark{margin-left:auto;font-weight:800;font-size:14px}
.matchgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,44px);gap:6px;align-items:center;overflow-x:auto}
.matchgrid .h{font-weight:800;text-align:center;font-size:15px}
.matchgrid .rowlbl{font-size:17px;padding-right:6px}
.matchgrid button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800}
.matchgrid button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.matchgrid button.is-right{outline:3px solid var(--good)}
.matchopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;font-size:17px}
.matchopts div{background:var(--paper);border-radius:10px;padding:6px 10px}
.numrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.numin{flex:1 1 180px;min-width:0;font-size:22px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;min-height:54px;font-variant-numeric:tabular-nums}
.numin:focus{border-color:var(--forest);outline:none;box-shadow:0 0 0 3px var(--forest-soft)}
.fmt{font-size:14px;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:15px}
.hintbox{background:var(--amber-soft);border-radius:14px;padding:10px 14px;font-size:16px}
.solution{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:12px 14px}
.solution ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.topbar-task{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--paper-2);color:var(--muted)}
.chip.forest{background:var(--forest-soft);color:var(--forest-d)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--amber)}
.dots i.ok{background:var(--good)}
.dots i.no{background:var(--bad)}
.dots i.hint{background:#e3b13b}

.topics{display:flex;flex-direction:column;gap:12px}
.topic{display:flex;flex-direction:column;gap:8px}
.topic h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.skill{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:76px}
.skill b{font-size:16px}
.skill span{font-size:13px;color:var(--muted)}
.skill .bar{height:6px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:4px}
.skill .bar i{display:block;height:100%;background:var(--forest)}
.nb-item{display:flex;flex-direction:column;gap:8px}
.nb-item .ans{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px}
.nb-item .ans dt{color:var(--muted);font-weight:700}
.nb-item .ans dd{margin:0}

/* ---------- mock ---------- */
.mock-top{position:sticky;top:0;z-index:4;background:var(--paper);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.timer.low{border-color:var(--bad);color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.navgrid button{min-height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;position:relative;font-size:15px;padding:0}
.navgrid button.saved{background:var(--forest);border-color:var(--forest);color:#fff}
.navgrid button.unsaved{border-color:var(--amber);background:var(--amber-soft)}
.navgrid button.cur{box-shadow:0 0 0 3px var(--ink)}
.navgrid button .flag{position:absolute;top:-6px;right:-4px;font-size:12px;background:var(--bad);color:#fff;border-radius:6px;padding:0 4px;line-height:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line);background:#fff;display:inline-block}
.legend i.s{background:var(--forest);border-color:var(--forest)}
.legend i.u{background:var(--amber-soft);border-color:var(--amber)}
.status{font-weight:800;font-size:14px}
.score-big{font-family:var(--f-head);font-size:clamp(40px,10vw,64px);line-height:1}
table.brk{width:100%;border-collapse:collapse;font-size:15px}
table.brk th,table.brk td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.brk td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
details.rvq{border:2px solid var(--line);border-radius:14px;background:#fff}
details.rvq summary{padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;list-style:none}
details.rvq summary::-webkit-details-marker{display:none}
details.rvq .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}

/* ---------- shop ---------- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.item.eq{border-color:var(--forest)}
.swatch{width:100%;height:56px;border-radius:10px}
canvas.prev{display:block;width:100%;height:150px;border-radius:12px;background:#bfe4f6}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(30,25,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:520px;max-height:calc(100% - 8px);overflow-y:auto;background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:680px}
.modal h2{font-size:24px}
.qrow{background:var(--paper);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qrow .top{display:flex;gap:10px;align-items:center;font-weight:700}
.qrow .top span{flex:1}
.qbar{height:8px;border-radius:99px;background:#fff;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--forest)}

function poly(coefs){ /* [[coef,letter],...] → рядок; порожній → 0 */
  let s="",first=true;
  for(const [c,l] of coefs){const t=term(c,l,first);if(t){s+=t;first=false}}
  return s||"0";
}

/* ---------- answer parsing / checking ---------- */
/* Строгий розбір числової відповіді.
   mode "mock": потрібна десяткова кома (крапка → помилка формату).
   mode "train": кома або крапка. */
function parseNum(raw,mode="train"){
  if(raw==null)return{ok:false,err:"empty"};
  let s=String(raw).trim().replace(/−|–|—/g,"-").replace(/\s+/g,"");
  if(!s)return{ok:false,err:"empty"};
  if(!/^[-+]?\d+(?:[.,]\d+)?$/.test(s))return{ok:false,err:"chars"};
  const usedDot=s.includes(".");
  if(usedDot&&mode==="mock")return{ok:false,err:"dot"};
  const v=Number(s.replace(",","."));
  if(!Number.isFinite(v))return{ok:false,err:"chars"};
  return{ok:true,value:v,usedDot};
}
const PARSE_MSG={empty:"Введи відповідь.",chars:"Відповідь має бути числом: цифри, за потреби мінус і одна десяткова кома. Наприклад: −2,5",dot:"На НМТ десятковий дріб записують через кому: 2,5, а не 2.5"};
const numEq=(a,b)=>Math.abs(a-b)<1e-9;

/* Перевірка відповіді на завдання будь-якого типу.
   answer: single → індекс; match → [i,i,i] (або null у рядку); numeric → рядок.
   Повертає {points,max,correct,parsed} */
function checkAnswer(task,answer,mode="train"){
  if(task.type==="single"){
    const max=task.pts??1;
    const ok=Number.isInteger(answer)&&answer===task.key;
    return{points:ok?max:0,max,correct:ok,answered:Number.isInteger(answer)};
  }
  if(task.type==="match"){
    const per=task.ptsPer??1,max=per*task.key.length;let p=0,any=false;
    for(let i=0;i<task.key.length;i++){const a=answer&&answer[i];if(Number.isInteger(a)){any=true;if(a===task.key[i])p+=per}}
    return{points:p,max,correct:p===max,answered:any,partial:p>0&&p<max};
  }
  if(task.type==="numeric"){
    const max=task.pts??2;
    const pr=parseNum(answer,mode);
    if(!pr.ok)return{points:0,max,correct:false,answered:pr.err!=="empty",parseErr:pr.err};
    const ok=numEq(pr.value,task.key);
    return{points:ok?max:0,max,correct:ok,answered:true,value:pr.value,usedDot:pr.usedDot};
  }
  throw new Error("unknown task type "+task.type);
}

function scaleFor(raw,year=2026){
  const f=FORMAT[year];
  if(!Number.isInteger(raw)||raw<0||raw>f.maxRaw)throw new Error("raw out of range "+raw);

function scoreAttempt(tasks,answers,mode="mock"){
  let raw=0;const per=[];

}

function choice5(R,correct,traps,fill){
  const seen=new Set([correct.k]),list=[{...correct,ok:true}];
  for(const t of traps){if(list.length>=5)break;if(t&&t.k!=null&&!seen.has(t.k)){seen.add(t.k);list.push(t)}}
  let g=0;while(list.length<5&&g++<400){const f=fill();if(f&&!seen.has(f.k)){seen.add(f.k);list.push(f)}}
  if(list.length<5)throw new Error("not enough options");

  return{options:list.map(o=>o.h),optKeys:list.map(o=>o.k),key:list.findIndex(o=>o.ok),traps:traps2};

skill("decimals","numbers","Дії з десятковими дробами",(R,d)=>{
  let p,stem,ans,traps,steps;
  if(d===1){
    const y=R.pick([2,3,4,5,6,8,12]),q=R.int(2,9),z=R.int(1,29);       // десяті
    p={y,q,z};const x=y*q;                                              // x,y у десятих
    const X=new Fr(x,10),Y=new Fr(y,10),Z=new Fr(z,10);
    ans=X.div(Y).sub(Z);
    stem=`Обчисліть ${fmtNum(X.v)} : ${fmtNum(Y.v)} − ${fmtNum(Z.v)}.`;
    const wrongOrder=Y.sub(Z).n!==0&&X.div(Y.sub(Z)).isDecimal()?X.div(Y.sub(Z)):null;
    traps=[wrongOrder&&ND(wrongOrder,"Спочатку виконують ділення, а вже потім віднімання."),ND(new Fr(q*10).sub(Z),`Частка ${fmtNum(X.v)} : ${fmtNum(Y.v)} = ${q}, а не ${q*10}: при діленні десяткових дробів кому переносять в обох числах.`),ND(new Fr(q,10).sub(Z),"Кому перенесено лише в одному числі."),ND(new Fr(q).add(Z),"Тут треба віднімати, а не додавати.")];
    steps=[`Спочатку ділення: ${fmtNum(X.v)} : ${fmtNum(Y.v)} = ${fmtNum(x)} : ${fmtNum(y)} = ${q}.`,`Потім віднімання: ${q} − ${fmtNum(Z.v)} = ${fmtNum(ans.v)}.`];
  }else{
    const a=R.int(11,59),b=R.int(2,9),c=R.int(2,6);                     // a,b десяті
    p={a,b,c};const A=new Fr(a,10),B=new Fr(-b,10);
    ans=new Fr(-a,10).sub(B.mul(c));                                     // −a − (−b)·c
    stem=`Обчисліть −${fmtNum(A.v)} − (−${fmtNum(b/10)}) · ${c}.`;
    traps=[ND(new Fr(-a,10).add(B.mul(c)),"Мінус перед дужкою змінює знак: −(−x) = +x."),ND(new Fr(-a,10).sub(new Fr(-b,10)).mul(c),"Спочатку множення, потім віднімання."),ND(new Fr(a,10).add(new Fr(b*c,10)),"Перше число відʼємне.")];
    steps=[`Множення: (−${fmtNum(b/10)}) · ${c} = −${fmtNum(b*c/10)}.`,`−${fmtNum(A.v)} − (−${fmtNum(b*c/10)}) = −${fmtNum(A.v)} + ${fmtNum(b*c/10)} = ${fmtNum(ans.v)}.`];
  }
  return task({type:"single",stem,params:{d,...p},...choice5(R,ND(ans),traps,()=>ND(ans.add(new Fr(R.pick([-1,1])*R.int(1,25),10)))),
    hints:["Порядок дій: спочатку множення і ділення, потім додавання і віднімання.","Перш ніж ділити десяткові дроби, перенеси кому в обох числах на однакову кількість знаків."],steps});
},p=>p.d===1?new Fr(p.y*p.q,10).div(new Fr(p.y,10)).sub(new Fr(p.z,10)).key():new Fr(-p.a+p.b*p.c,10).key());

const ITEMS=["рюкзак","куртка","навушники","книжка","кросівки","годинник","настільна лампа","термос"];
skill("pct-change","numbers","Відсотки: зміна ціни",(R,d)=>{
  let P,p,dir,q,stem,ans,traps,steps,params;
  if(d===1){
    p=R.pick([10,20,25,30,40,50]);do{P=R.int(4,40)*50}while(P*p%100);dir=R.pick([-1,1]);
    params={d,P,p,dir};const A=P*p/100;ans=P+dir*A;
    const it=R.pick(ITEMS);
    stem=`${it[0].toUpperCase()+it.slice(1)} коштував ${P} грн. Ціну ${dir<0?"знизили":"підвищили"} на ${p}%. Скільки тепер коштує ${it}?`;
    traps=[NI(A,`${A} грн — це лише ${p}% від ціни. Їх треба ${dir<0?"відняти від":"додати до"} ${P} грн.`),NI(P-dir*A,`Ціну треба ${dir<0?"зменшити":"збільшити"}, а не навпаки.`),NI(P+dir*p,`${p}% — це не ${p} грн, а ${p}/100 від ціни.`)];
    steps=[`${p}% від ${P} = ${P} · ${p} : 100 = ${A} грн.`,`${dir<0?`${P} − ${A}`:`${P} + ${A}`} = ${ans} грн.`];
  }else{
    p=R.pick([10,20,25,50]);q=R.pick([10,20,50]);do{P=R.int(4,40)*100}while((P*(100+p))%100||((P*(100+p)/100)*q)%100);
    params={d,P,p,q};const up=P*(100+p)/100;ans=up*(100-q)/100;
    stem=`Ціну товару спочатку підвищили на ${p}%, а потім нову ціну знизили на ${q}%. Якою стала ціна, якщо спочатку вона була ${P} грн?`;
    traps=[NI(P*(100+p-q)/100,`Відсотки не можна просто відняти: друга зміна рахується від нової ціни ${up} грн.`),NI(P*(100-q)/100,"Забули про перше підвищення."),NI(up,"Після підвищення ціну ще знизили.")];
    steps=[`Після підвищення: ${P} · ${fmtNum(1+p/100)} = ${up} грн.`,`Після зниження: ${up} · ${fmtNum(1-q/100)} = ${ans} грн.`];
  }
  return task({type:"single",stem,params,...choice5(R,NI(ans),traps,()=>NI(ans+R.pick([-1,1])*R.int(1,8)*10)),
    hints:["p% — це p/100 частина величини.",d===1?`Знайди, скільки гривень становлять ${p}% від ${P}.`:"Кожен відсоток рахуй від ціни, яка була перед цією зміною."],steps});
},p=>p.d===1?String(Math.round(p.P*(100+p.dir*p.p))/100):String(p.P*(100+p.p)*(100-p.q)/10000));

skill("pct-reverse","numbers","Відсотки: початкова ціна",(R,d)=>{
  const p=R.pick([10,20,25,40,50]);const up=d===2;let O;
  do{O=R.int(30,300)*10}while((O*(up?100+p:100-p))%100);
  const Nw=O*(up?100+p:100-p)/100;const it=R.pick(ITEMS);const k=up?100+p:100-p;
  const stem=up?`Після подорожчання на ${p}% ${it} коштує ${Nw} грн. Якою була початкова ціна?`:`Після знижки ${p}% ${it} коштує ${Nw} грн. Якою була початкова ціна?`;
  const t1=Nw*(up?100-p:100+p)/100;
  const traps=[NI(t1,up?`Тут ${p}% віднято від нової ціни, а подорожчання рахували від початкової.`:`Тут ${p}% додано до ціни зі знижкою, хоча знижку рахували від початкової ціни.`),NI(up?Nw-p:Nw+p,`${p}% — це частка ціни, а не ${p} грн.`),NI(Nw*p/100,`Це лише ${p}% від ${Nw}.`)];
  return task({type:"single",stem,params:{d,p,O,Nw,up},...choice5(R,NI(O),traps,()=>NI(O+R.pick([-1,1])*R.int(1,9)*10)),
    hints:[`Ціна ${Nw} грн — це ${k}% від початкової.`,`Познач початкову ціну x і запиши: ${fmtNum(k/100)}x = ${Nw}.`],
    steps:[`${Nw} грн — це ${k}% початкової ціни.`,`Нехай x — початкова ціна. ${fmtNum(k/100)}x = ${Nw}.`,`x = ${Nw} : ${fmtNum(k/100)} = ${O} грн.`]});
},p=>String(Math.round(p.Nw*100/(p.up?100+p.p:100-p.p))));

skill("frac-ops","numbers","Дії зі звичайними дробами",(R,d)=>{
  let a,b,c,e;do{b=R.int(2,9);e=R.int(2,9);a=R.int(1,b-1);c=R.int(1,e-1)}while(b===e||gcd(a,b)>1||gcd(c,e)>1);
  const op=d===1?R.pick(["+","−"]):R.pick(["·",":"]);
  const A=new Fr(a,b),C=new Fr(c,e);
  const ans=op==="+"?A.add(C):op==="−"?A.sub(C):op==="·"?A.mul(C):A.div(C);
  const L=lcm(b,e);
  const traps=op==="+"||op==="−"?[N(new Fr(op==="+"?a+c:a-c,b+e),"Знаменники не додають і не віднімають: спочатку зведи дроби до спільного знаменника."),N(A.mul(C),"Це добуток дробів, а потрібна "+(op==="+"?"сума.":"різниця.")),N(op==="+"?A.sub(C):A.add(C),"Переплутано знак дії.")]
    :[N(op==="·"?A.div(C):A.mul(C),op==="·"?"Це частка, а потрібен добуток.":"При діленні другий дріб перевертають і множать."),N(new Fr(a*e,b*c).eq(ans)?new Fr(a+c,b+e):new Fr(c*b,a*e),"Перевернуто не той дріб."),N(new Fr(a+c,b+e),"Дроби не додають почленно.")];
  const steps=op==="+"||op==="−"?[`Спільний знаменник: ${L}.`,`${frHtml(a*L/b,L)} ${op} ${frHtml(c*L/e,L)} = ${(op==="+"?a*L/b+c*L/e:a*L/b-c*L/e)<0?"−":""}${frHtml(Math.abs(op==="+"?a*L/b+c*L/e:a*L/b-c*L/e),L)}.`,`Після скорочення: ${qHtml(ans)}.`]
    :op==="·"?[`Чисельник множимо на чисельник, знаменник на знаменник: ${frHtml(a+" · "+c,b+" · "+e)}.`,`Результат: ${qHtml(ans)}.`]
    :[`Ділення замінюємо множенням на обернений дріб: ${frHtml(a,b)} · ${frHtml(e,c)}.`,`Результат: ${qHtml(ans)}.`];
  return task({type:"single",stem:`Обчисліть ${frHtml(a,b)} ${op} ${frHtml(c,e)}.`,params:{a,b,c,e,op},...choice5(R,N(ans),traps,()=>N(ans.add(new Fr(R.pick([-1,1]),R.int(2,12))))),
    hints:[op==="+"||op==="−"?"Дроби додають і віднімають лише зі спільним знаменником.":"Чисельник множать на чисельник, знаменник на знаменник; ділення — це множення на обернений дріб.",op==="+"||op==="−"?`Найменший спільний знаменник ${b} і ${e} — це ${L}.`:`Перетвори вираз так, щоб лишилося лише множення.`],steps});
},p=>{const A=new Fr(p.a,p.b),C=new Fr(p.c,p.e);return(p.op==="+"?A.add(C):p.op==="−"?A.sub(C):p.op==="·"?A.mul(C):A.div(C)).key()});

skill("powers","numbers","Степені та їх властивості",(R,d)=>{
  if(d===1){
    let m,n,k,l,E;do{m=R.int(2,4);n=R.int(2,3);k=R.int(1,5);l=R.int(1,6);E=m*n+k-l}while(E<1||E>16);
    const sh=x=>`a${sup(x)}`;const O=x=>({k:String(x),h:sh(x)});
    const traps=[{...O(m+n+k-l),why:"При піднесенні степеня до степеня показники множать, а не додають."},{...O(m*n+k+l),why:"При діленні степенів з однаковою основою показники віднімають."},{...O(m*n*k-l),why:"При множенні степенів показники додають, а не множать."}];
    return task({type:"single",stem:`Спростіть вираз (a${sup(m)})${sup(n)} · a${sup(k)} : a${sup(l)}.`,params:{d,m,n,k,l},...choice5(R,O(E),traps,()=>O(R.int(1,20))),
      hints:["(aᵐ)ⁿ = aᵐⁿ; aᵐ · aᵏ = aᵐ⁺ᵏ; aᵐ : aᵏ = aᵐ⁻ᵏ.",`Спочатку (a${sup(m)})${sup(n)} = a${sup(m*n)}.`],
      steps:[`(a${sup(m)})${sup(n)} = a${sup(m*n)}.`,`a${sup(m*n)} · a${sup(k)} = a${sup(m*n+k)}.`,`a${sup(m*n+k)} : a${sup(l)} = a${sup(E)}.`]});
  }
  let a,b,c,E;do{a=R.int(3,7);b=R.int(2,6);c=R.int(3,9);E=a+b-c}while(E<1||E>6);
  const v=2**E;
  const traps=[NI(2**(a*b-c)>2000?3:2**Math.max(1,a*b-c),"При множенні степенів показники додають."),NI(2*E,`2${sup(E)} — це не 2 · ${E}.`),NI(2**(a+b+c)>5000?E:2**(a+b+c),"При діленні показники віднімають.")];
  return task({type:"single",stem:`Обчисліть 2${sup(a)} · 2${sup(b)} : 2${sup(c)}.`,params:{d,a,b,c},...choice5(R,NI(v),traps,()=>NI(2**R.int(0,8))),
    hints:["При множенні степенів з однаковою основою показники додають, при діленні — віднімають.",`Отримаєш 2 в степені ${a} + ${b} − ${c}.`],
    steps:[`2${sup(a)} · 2${sup(b)} : 2${sup(c)} = 2${sup(a+b-c)}.`,`2${sup(E)} = ${v}.`]});
},p=>p.d===1?String(p.m*p.n+p.k-p.l):String(Math.pow(2,p.a)*Math.pow(2,p.b)/Math.pow(2,p.c)));

skill("roots","numbers","Корені",(R,d)=>{
  if(d===1){
    const pair=R.pick([[2,8],[3,12],[2,18],[5,20],[3,27],[2,32],[2,50],[6,24],[3,48],[7,28]]);const [a,b]=pair;const s=Math.sqrt(a*b);
    const traps=[NI(a*b,"Забули добути корінь із добутку."),NI(a+b,"√a · √b = √(ab), а не a + b."),NI(s*s*2===a*b?s+1:2*s,"Перевір: √(ab) — це число, квадрат якого дорівнює ab.")];
    return task({type:"single",stem:`Обчисліть √${a} · √${b}.`,params:{d,a,b},...choice5(R,NI(s),traps,()=>NI(R.int(2,30))),
      hints:["√a · √b = √(a · b) для невідʼємних a і b.",`Обчисли ${a} · ${b} і знайди корінь.`],steps:[`√${a} · √${b} = √(${a} · ${b}) = √${a*b}.`,`√${a*b} = ${s}, бо ${s}² = ${a*b}.`]});
  }
  const m=R.pick([2,3,5,6,7]),k=R.int(2,9);const n=k*k*m;
  const O=(x,y,why)=>({k:x+"r"+y,h:`${x===1?"":x}√${y}`,why});
  const traps=[O(m,k,"Переплутано множник і число під коренем."),O(k*k,m,`З-під кореня виносять √${k*k} = ${k}, а не ${k*k}.`),{k:"r"+(k+m),h:`√${k+m}`,why:"Корінь не розкладається на суму."}];
  return task({type:"single",stem:`Винесіть множник з-під знака кореня: √${n}.`,params:{d,k,m},...choice5(R,O(k,m),traps,()=>O(R.int(2,12),R.pick([2,3,5,6,7,10]))),
    hints:["√(a² · b) = a√b.",`Розклади ${n} на множники так, щоб один був повним квадратом: ${n} = ${k*k} · ${m}.`],steps:[`${n} = ${k*k} · ${m}.`,`√${n} = √${k*k} · √${m} = ${k}√${m}.`]});
},p=>p.d===1?String(Math.sqrt(p.a*p.b)):p.k+"r"+p.m);

skill("logs","numbers","Логарифми",(R,d)=>{

    const ans=n+m;

    return task({type:"single",stem:`Обчисліть ${lg(b,b**n)} + ${lg(c,c**m)}.`,params:{d,b,n,c,m},...choice5(R,NI(ans),traps,()=>NI(R.int(0,12))),
      hints:["logₐ aᵏ = k: логарифм показує, в який степінь треба піднести основу.",`${b**n} = ${b}${sup(n)}.`],
      steps:[`${lg(b,b**n)} = ${n}, бо ${b}${sup(n)} = ${b**n}.`,`${lg(c,c**m)} = ${m}, бо ${c}${sup(m)} = ${c**m}.`,`${n} + ${m} = ${ans}.`]});
  }

},p=>p.d===1?String(Math.round(Math.log(p.b**p.n)/Math.log(p.b)+Math.log(p.c**p.m)/Math.log(p.c))):String(Math.round(Math.log(p.a**p.n*p.y/p.y)/Math.log(p.a))));


skill("progression","numbers","Арифметична прогресія",(R,d)=>{

  if(d===1){const an=a1+(n-1)*dd;

      hints:["aₙ = a₁ + (n − 1)d.",`a${sub(n)} = ${fmtNum(a1)} + ${n-1} · ${neg(dd)}.`],steps:[`aₙ = a₁ + (n − 1)d.`,`a${sub(n)} = ${fmtNum(a1)} + ${n-1} · ${neg(dd)} = ${fmtNum(an)}.`]});}
  const an=a1+(n-1)*dd,S=(a1+an)*n/2;
  const traps=[NI((a1+an)*n,"Суму (a₁ + aₙ) · n ще треба поділити на 2."),NI(an,"Це n-й член, а потрібна сума."),NI((a1+a1+n*dd)*n/2,`aₙ = a₁ + (n − 1)d, тобто a${sub(n)} = ${fmtNum(an)}.`)];
  return task({type:"single",stem:`В арифметичній прогресії a₁ = ${fmtNum(a1)}, d = ${fmtNum(dd)}. Знайдіть суму перших ${n} членів.`,params:{d,a1,dd,n},...choice5(R,NI(S),traps,()=>NI(S+R.pick([-1,1])*R.int(1,20))),
    hints:["Sₙ = (a₁ + aₙ) · n : 2.",`Спочатку знайди a${sub(n)} = a₁ + (n − 1)d.`],steps:[`a${sub(n)} = ${fmtNum(a1)} + ${n-1} · ${neg(dd)} = ${fmtNum(an)}.`,`S${sub(n)} = (${fmtNum(a1)} + ${neg(an)}) · ${n} : 2 = ${fmtNum(S)}.`]});
},p=>{let a=p.a1,s=0;for(let i=1;i<=p.n;i++){s+=a;if(i<p.n)a+=p.dd}return String(p.d===1?a:s)});

skill("linear-eq","eq","Лінійні рівняння",(R,d)=>{

function genTask(skillId,seed,diff=1){
  const s=SK[skillId];if(!s)throw new Error("no skill "+skillId);
  const R=OWL.makeRng(seed);
  const t=s.gen(R,diff);

  return t;
}
/* перевірка коректності згенерованого завдання (ключ — окремо від генератора) */
function validateTask(t){
  const errs=[];const html=JSON.stringify([t.stem,t.options,t.steps,t.hints,t.fig]);
  if(/NaN|undefined|Infinity|\[object|null<|>null/.test(html))errs.push("bad token");
  if(!t.stem||t.stem.length<8)errs.push("empty stem");
  if(!t.steps||!t.steps.length)errs.push("no steps");
  if(!t.hints||t.hints.length<2)errs.push("hints<2");
  if(/xx|\+ −|− −|\+ \+|(^|[^\d,])1x/.test(t.stem.replace(/<[^>]+>/g," ")))errs.push("bad formatting: "+t.stem);
  const solved=SK[t.skill]&&t.params?SK[t.skill].solve(t.params):null;
  if(t.type==="single"){
    if(!t.options||t.options.length!==5)errs.push("options!=5");
    if(new Set(t.optKeys).size!==5)errs.push("duplicate option values");
    if(new Set(t.options).size!==5)errs.push("duplicate option text");
    if(!(t.key>=0&&t.key<5))errs.push("bad key");
    if(solved!=null&&t.optKeys[t.key]!==String(solved))errs.push(`key mismatch ${t.optKeys[t.key]} vs ${solved}`);
  }else if(t.type==="numeric"){
    if(!Number.isFinite(t.key))errs.push("numeric key not finite");
    if(solved!=null&&!OWL.numEq(t.key,solved))errs.push(`key mismatch ${t.key} vs ${solved}`);
    if(Math.round(t.key*100)!==t.key*100)errs.push("needs rounding but no precision stated");
  }else if(t.type==="match"){
    if(t.key.length!==t.rows.length)errs.push("match length");
    if(new Set(t.optKeys||t.options).size!==t.options.length)errs.push("dup match options");
  }
  return errs;
}

  v:2,coins:0,gems:0,created:Date.now(),
  special:{d:{key:"",stars:0},w:{key:"",stars:0}},
  settings:{speed:1,math:0,control:"move",calmTimer:false,volume:0.7,muted:false,motion:"system"},
  arcade:{stars:{},open:1,tutDone:false,results:0,seen:[]},
  cosm:{owned:["basket-classic","owl-brown","bg-summer","persona-none"],eq:{basket:"basket-classic",owl:"owl-brown",bg:"bg-summer",persona:"persona-none"}},
  skills:{},notebook:[],
  quests:{prog:{},claimed:{}},
  mock:{active:null,history:[]},
  diag:{done:false,date:0},
  log:{sessions:0,lastTrain:0,lastSkill:null,days:[]},
}}

/* ---------- валідація / міграція ---------- */
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
const int=(v,a,b,def)=>Number.isInteger(v)&&v>=a&&v<=b?v:def;
const num=(v,a,b,def)=>typeof v==="number"&&Number.isFinite(v)&&v>=a&&v<=b?v:def;
const str=(v,max,def)=>typeof v==="string"&&v.length<=max?v:def;
function validateV2(o){
  if(!isObj(o)||o.v!==2)return null;
  const D=defaults(),S=D;
  S.coins=int(o.coins,0,1e7,0);S.gems=int(o.gems,0,1e6,0);
  if(isObj(o.special))for(const k of ["d","w"]){const v=o.special[k];if(isObj(v))S.special[k]={key:str(v.key,20,""),stars:int(v.stars,0,3,0)}}S.created=num(o.created,0,1e14,Date.now());
  if(isObj(o.settings)){const s=o.settings;S.settings={speed:int(s.speed,0,2,1),math:int(s.math,0,1,0),control:["move","buttons"].includes(s.control)?s.control:"move",calmTimer:!!s.calmTimer,volume:num(s.volume,0,1,0.7),muted:!!s.muted,motion:["system","reduce","full"].includes(s.motion)?s.motion:"system"}}
  if(isObj(o.arcade)){const st={};if(isObj(o.arcade.stars))for(const [k,v] of Object.entries(o.arcade.stars)){const i=+k;if(Number.isInteger(i)&&i>=0&&i<12&&Number.isInteger(v)&&v>=0&&v<=3)st[i]=v}
    S.arcade={stars:st,open:int(o.arcade.open,1,12,1),tutDone:!!o.arcade.tutDone,results:int(o.arcade.results,0,1e7,0),seen:Array.isArray(o.arcade.seen)?[...new Set(o.arcade.seen.filter(x=>Number.isInteger(x)&&x>=0&&x<12))]:[]}}
  if(isObj(o.cosm)){const ids=COSMETICS.map(c=>c.id);const owned=Array.isArray(o.cosm.owned)?o.cosm.owned.filter(x=>ids.includes(x)):[];
    S.cosm.owned=[...new Set([...D.cosm.owned,...owned])];
    if(isObj(o.cosm.eq))for(const k of ["basket","owl","bg","persona"]){const v=o.cosm.eq[k];if(S.cosm.owned.includes(v)&&COSMETICS.find(c=>c.id===v).kind===k)S.cosm.eq[k]=v}}
  if(isObj(o.skills))for(const [k,v] of Object.entries(o.skills)){if(!OWL.SK[k]||!isObj(v))continue;
    S.skills[k]={att:int(v.att,0,1e6,0),solo:int(v.solo,0,1e6,0),hinted:int(v.hinted,0,1e6,0),wrong:int(v.wrong,0,1e6,0),last:num(v.last,0,1e14,0),streak:int(v.streak,0,1e6,0),wrongRun:int(v.wrongRun,0,1e6,0),diff:int(v.diff,1,2,1)}}
  if(Array.isArray(o.notebook))S.notebook=o.notebook.filter(e=>isObj(e)&&OWL.SK[e.skill]&&typeof e.eid==="string").slice(-300).map(e=>({eid:str(e.eid,80,"e"+Math.random()),skill:e.skill,diff:int(e.diff,1,2,1),seed:int(e.seed,1,2147483647,1),stem:str(e.stem,20000,""),user:str(e.user,2000,""),correct:str(e.correct,2000,""),why:str(e.why,4000,""),created:num(e.created,0,1e14,0),due:num(e.due,0,1e14,0),stage:int(e.stage,0,5,0),closed:!!e.closed,src:str(e.src,40,"train")}));
  if(isObj(o.quests)){for(const part of ["prog","claimed"])if(isObj(o.quests[part]))for(const [k,v] of Object.entries(o.quests[part])){if(/^[dw]:\d{4}-\d\d-\d\d:[a-z0-9]+$/.test(k))S.quests[part][k]=part==="prog"?int(v,0,1e6,0):!!v}}
  if(isObj(o.mock)){S.mock.history=Array.isArray(o.mock.history)?o.mock.history.filter(isObj).slice(-50).map(h=>({id:str(h.id,40,"mock"),date:num(h.date,0,1e14,0),raw:int(h.raw,0,32,0),scale:h.scale===null?null:int(h.scale,100,200,null)})):[];
    const a=o.mock.active;if(isObj(a)&&typeof a.id==="string"&&num(a.endAt,0,1e14,0)&&isObj(a.answers))S.mock.active=sanitizeMock(a)}
  if(isObj(o.diag))S.diag={done:!!o.diag.done,date:num(o.diag.date,0,1e14,0)};
  if(isObj(o.log))S.log={sessions:int(o.log.sessions,0,1e6,0),lastTrain:num(o.log.lastTrain,0,1e14,0),lastSkill:OWL.SK[o.log.lastSkill]?o.log.lastSkill:null,days:Array.isArray(o.log.days)?o.log.days.filter(x=>typeof x==="string").slice(-60):[]};
  return S;
}
function sanitizeMock(a){
  const ans={};for(const [k,v] of Object.entries(a.answers)){const i=+k;if(!Number.isInteger(i)||i<0||i>=22||!isObj(v))continue;ans[i]={saved:v.saved===undefined?undefined:v.saved,draft:v.draft===undefined?undefined:v.draft}}
  const flags={};if(isObj(a.flags))for(const [k,v] of Object.entries(a.flags))if(Number.isInteger(+k))flags[+k]=!!v;
  return{id:a.id,startedAt:num(a.startedAt,0,1e14,Date.now()),endAt:a.endAt,answers:ans,flags,cur:int(a.cur,0,21,0),finished:!!a.finished,result:isObj(a.result)?a.result:null};
}
function migrateV1(o){
  if(!isObj(o)||o.v!==1)return null;
  const S=defaults();
  S.coins=int(o.coins,0,1e7,0);
  if(isObj(o.stars))for(const [k,v] of Object.entries(o.stars)){const n=OWL.ARCADE.V1_MAP[+k];if(n!==undefined&&Number.isInteger(v)&&v>=0&&v<=3)S.arcade.stars[n]=Math.max(S.arcade.stars[n]||0,v)}
  const open=int(o.open,1,12,1);let mx=0;for(let i=0;i<open;i++)mx=Math.max(mx,OWL.ARCADE.V1_MAP[i]);S.arcade.open=Math.min(12,mx+1);
  S.settings.speed=int(o.diff,0,2,1);S.settings.muted=o.sound===false;
  S.arcade.tutDone=open>1;
  return S;
}
function parseImport(text){
  let o;try{o=JSON.parse(text)}catch(e){return{ok:false,err:"Це не схоже на файл збереження: не вдалося прочитати JSON."}}
  if(isObj(o)&&o.v===2){const S=validateV2(o);return S?{ok:true,data:S,from:2}:{ok:false,err:"Файл пошкоджений."}}
  if(isObj(o)&&o.v===1){const S=migrateV1(o);return S?{ok:true,data:S,from:1}:{ok:false,err:"Файл пошкоджений."}}
  return{ok:false,err:"Невідома версія збереження. Підтримуються версії 1 і 2."};
}

/* ---------- сховище з резервом у памʼяті ---------- */
const Store={mode:"local",corruptRaw:null,migrated:false,key:KEY,
  /* окреме локальне сховище для кожного акаунта (кеш хмарного прогресу) */
  useKey(k){this.key=k||KEY;this.corruptRaw=null},
  peek(k){try{const o=JSON.parse(localStorage.getItem(k)||"null");return validateV2(o)}catch(e){return null}},
  test(){try{const k="__owl_t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true}catch(e){return false}},
  load(){
    if(!this.test()){this.mode="memory";return defaults()}
    let raw=null;try{raw=localStorage.getItem(this.key)}catch(e){}
    if(raw){let o=null;try{o=JSON.parse(raw)}catch(e){}const S=validateV2(o);if(S)return S;this.corruptRaw=raw;return defaults()}
    if(this.key!==KEY)return defaults();
    let r1=null;try{r1=localStorage.getItem(V1KEY)}catch(e){}
    if(r1){let o=null;try{o=JSON.parse(r1)}catch(e){}const S=migrateV1(o);if(S){this.migrated=true;return S}}
    return defaults();
  },
  save(S){if(this.mode!=="local")return false;if(this.corruptRaw)return false; /* не перезаписуємо пошкоджене, доки користувач не вирішить */
    try{localStorage.setItem(this.key,JSON.stringify(S));return true}catch(e){this.mode="memory";return false}},
  discardCorrupt(){this.corruptRaw=null},
};

/* ---------- статистика навичок ---------- */
function skillStat(S,id){return S.skills[id]||(S.skills[id]={att:0,solo:0,hinted:0,wrong:0,last:0,streak:0,wrongRun:0,diff:1})}
/* record → повертає підказку адаптації: {offerWorked} / {offerHarder} */
function recordAnswer(S,id,correct,hinted,now){
  const s=skillStat(S,id);s.att++;s.last=now;
  let adapt=null;
  if(correct&&!hinted){s.solo++;s.streak++;s.wrongRun=0;if(s.streak>=3&&s.diff===1)adapt="harder"}
  else if(correct){s.hinted++;s.streak=0;s.wrongRun=0}
  else{s.wrong++;s.streak=0;s.wrongRun++;if(s.wrongRun>=2)adapt="easier"}
  return adapt;
}
function skillSummary(S,id){
  const s=S.skills[id];
  if(!s||s.att<3)return{enough:false,text:"Потрібно більше спроб",att:s?s.att:0,rate:null};
  return{enough:true,text:`${s.solo} із ${s.att} самостійно`,att:s.att,rate:s.solo/s.att,hinted:s.hinted};
}
function weakSkills(S){
  const out=[];
  for(const id of Object.keys(OWL.SK)){const s=S.skills[id];const openErr=S.notebook.filter(e=>e.skill===id&&!e.closed).length;
    if((s&&s.att>=3&&s.solo/s.att<0.6)||openErr>=1)out.push({id,score:(s&&s.att?s.solo/s.att:0.5)-openErr*0.1})}
  return out.sort((a,b)=>a.score-b.score).map(x=>x.id);
}

/* ---------- зошит помилок ---------- */
const STAGE_DAYS=[1,3,7];
function addMistake(S,e,now){
  if(S.notebook.some(x=>x.skill===e.skill&&x.seed===e.seed&&!x.closed))return null;
  const entry=Object.assign({eid:"e"+now.toString(36)+Math.floor(Math.random()*1e4),created:now,due:now+STAGE_DAYS[0]*DAY,stage:0,closed:false},e);
  S.notebook.push(entry);if(S.notebook.length>300)S.notebook.splice(0,S.notebook.length-300);
  return entry;
}
/* результат самостійного розвʼязання схожого завдання */
function mistakeAttempt(S,eid,solvedSolo,now){
  const e=S.notebook.find(x=>x.eid===eid);if(!e||e.closed)return null;
  if(solvedSolo){e.stage++;if(e.stage>=2){e.closed=true;e.closedAt=now;return"closed"}e.due=now+STAGE_DAYS[e.stage]*DAY;return"advanced"}
  e.due=now+DAY;return"retry";
}
const dueToday=(S,now)=>S.notebook.filter(e=>!e.closed&&e.due<endOfDay(now));

/* ---------- квести ---------- */
function fireQuest(S,ev,n,now){
  const Q=questsFor(now);
  for(const kind of ["d","w"])for(const q of Q[kind].list){
    if(q.ev!==ev)continue;const key=`${kind}:${Q[kind].period}:${q.id}`;
    if(S.quests.claimed[key])continue;S.quests.prog[key]=Math.min(q.goal,(S.quests.prog[key]||0)+n);
  }
  /* прибираємо старі періоди */
  const keep=new Set([Q.d.period,Q.w.period]);
  for(const part of ["prog","claimed"])for(const k of Object.keys(S.quests[part])){const per=k.split(":")[1];if(!keep.has(per)&&per<Q.w.period)delete S.quests[part][k]}
}
function questView(S,now){
  const Q=questsFor(now);const out={d:[],w:[],period:{d:Q.d.period,w:Q.w.period}};
  for(const kind of ["d","w"])for(const q of Q[kind].list){const key=`${kind}:${Q[kind].period}:${q.id}`;out[kind].push({...q,key,p:S.quests.prog[key]||0,claimed:!!S.quests.claimed[key]})}
  return out;
}
/* повертає {ok, coins} або {ok:false, reason:"stale"|"claimed"|"notdone"} — ідемпотентно */
function claimQuest(S,key,now){
  const v=questView(S,now);const q=[...v.d,...v.w].find(x=>x.key===key);
  if(!q)return{ok:false,reason:"stale"};
  if(S.quests.claimed[key])return{ok:false,reason:"claimed"};
  if(q.p<q.goal)return{ok:false,reason:"notdone"};
  S.quests.claimed[key]=true;S.coins+=q.rw;const gem=q.gem||0;S.gems=(S.gems||0)+gem;
  return{ok:true,coins:q.rw,gems:gem};
}
const claimableCount=(S,now)=>{const v=questView(S,now);return[...v.d,...v.w].filter(q=>!q.claimed&&q.p>=q.goal).length};

/* ---------- наступна дія ---------- */
function nextAction(S,now){
  const due=dueToday(S,now);
  const anyActivity=S.log.sessions>0||S.arcade.results>0||Object.keys(S.skills).length>0;
  if(!anyActivity)return{kind:"first"};
  if(due.length){const top={};for(const e of due)top[e.skill]=(top[e.skill]||0)+1;const sk=Object.entries(top).sort((a,b)=>b[1]-a[1])[0][0];
    return{kind:"review",skill:sk,count:due.length,label:`Повторити помилки: ${OWL.SK[sk].name.toLowerCase()}`,sub:`${due.length} ${due.length===1?"завдання":"завдання"} на сьогодні`}}
  const weak=weakSkills(S);
  if(weak.length)return{kind:"weak",skill:weak[0],label:`Потренувати: ${OWL.SK[weak[0]].name.toLowerCase()}`,sub:skillSummary(S,weak[0]).text};
  if(S.log.sessions>=3&&!S.mock.history.length)return{kind:"mock",label:"Спробувати пробний НМТ",sub:"22 завдання, близько 60 хвилин"};
  if(S.log.lastSkill)return{kind:"continue",skill:S.log.lastSkill,label:"Продовжити тренування",sub:OWL.SK[S.log.lastSkill].name};
  return{kind:"continue",skill:null,label:"Почати тренування",sub:"Обери тему або пройди розминку"};
}

Object.assign(OWL,{STATE:{KEY,V1KEY,DAY,dayKey,weekKey,weekStart,endOfDay,COSMETICS,QUESTS,questsFor,defaults,validateV2,migrateV1,parseImport,Store,skillStat,recordAnswer,skillSummary,weakSkills,addMistake,mistakeAttempt,dueToday,fireQuest,questView,claimQuest,claimableCount,nextAction,sanitizeMock}});
})();

/* ---- arcade.js ---- */
/* ============================================================
   ARCADE ENGINE — полотно, сова, хмаринки. Логіка раунду
   відокремлена від малювання (step/apply*), щоб її тестувати.
   ============================================================ */
(function(){
const {LEVELS}=OWL.ARCADE;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FALL=[8,6,4.5];               // секунд від появи до кошика: Повільно / Звичайно / Швидко
const SPEED_NAMES=["Повільно","Звичайно","Швидко"];
const GOAL=8,LIVES=3,ROTATE_EVERY=4,SPLASH=2.4;

/* ---------------- чиста логіка раунду ---------------- */
function newRound(opts){
  const L=LEVELS[opts.level];const seed=opts.seed||OWL.newSeed();const R=OWL.makeRng(seed);
  const st=L.setup(R,opts.math||0);
  return{level:opts.level,L,R,seed,st,math:opts.math||0,speed:opts.speed??1,mode:opts.mode||"move",calmTimer:!!opts.calmTimer,tutorial:!!opts.tutorial,
    fall:FALL[opts.speed??1]*(L.slow||1),maxItems:L.slow?3:4,goal:opts.tutorial?1:GOAL,lives:LIVES,missCosts:(opts.speed??1)===2,
    items:[],log:[],correct:0,wrongCaught:0,missed:0,streak:0,maxStreak:0,coins:0,
    t:0,spawnT:0.3,sinceOk:0,phase:"splash",splashT:SPLASH,splashText:L.rule(st),pendingRotate:false,ended:false,result:null,nextId:1,
    tut:opts.tutorial?{step:1,msg:"Ця хмаринка дорівнює 10. Підстав під неї кошик!"}:null,
    calm:null};
}
function ruleText(G){return G.tutorial?"Лови вирази, що дорівнюють 10":G.L.rule(G.st)}
function makeItem(G,ok,forced){
  let it;
  if(forced)it=forced;
  else{
    /* вирази в раунді не повторюються: шукаємо ще не бачений (спільно для всіх правил раунду) */
    if(!G.seenAll)G.seenAll=new Set(),G.recent=[];const seen=G.seenAll;
    const onScreen=t=>G.items.some(o=>o.t===t);
    let tries=0;do{it=G.L.gen(G.R,G.st,ok);tries++}while(tries<200&&(seen.has(it.t)||onScreen(it.t)));
    if(seen.has(it.t)||onScreen(it.t)){tries=0;do{it=G.L.gen(G.R,G.st,ok);tries++}while(tries<80&&(onScreen(it.t)||G.recent.includes(it.t)))}
    seen.add(it.t);G.recent.push(it.t);if(G.recent.length>14)G.recent.shift();G.lastT=it.t;
  }
  return{id:G.nextId++,t:it.t,ok:it.ok,why:it.why,rule:ruleText(G),nx:.5,p:0,state:"fall",w:0,h:0,fs:0,age:0};
}
function spawn(G,nx){
  let ok=G.R.chance(.5);if(G.sinceOk>=2)ok=true;G.sinceOk=ok?0:G.sinceOk+1;
  const it=makeItem(G,ok);
  if(nx==null){let best=.5,bd=-1;for(let k=0;k<7;k++){const x=.12+G.R.f()*.76;let md=9;for(const o of G.items)if(o.p<.45)md=Math.min(md,Math.abs(o.nx-x));if(md>bd){bd=md;best=x}}nx=best}
  it.nx=nx;G.items.push(it);return it;
}
/* записуємо подію; повертаємо true, якщо раунд завершився */
function record(G,it,outcome){
  G.log.push({t:it.t,ok:it.ok,why:it.why,rule:it.rule,outcome});
  if(outcome==="caught-ok"){G.correct++;G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);
    if(G.L.mix&&G.correct<G.goal&&G.correct%ROTATE_EVERY===0)G.pendingRotate=true}
  else if(outcome==="caught-wrong"){G.wrongCaught++;G.streak=0;G.lives--}
  else if(outcome==="missed-ok"){G.missed++;G.streak=0;if(G.missCosts)G.lives--}
  return checkEnd(G);
}
/* однозначне завершення: події обробляються по черзі, перша подія,
   що досягла цілі або забрала останнє сердечко, завершує раунд */
function checkEnd(G){
  if(G.ended)return true;
  if(G.correct>=G.goal){finish(G,true);return true}
  if(G.lives<=0){finish(G,false);return true}
  return false;
}
function finish(G,won){
  G.ended=true;G.phase="end";
  const errors=G.wrongCaught+G.missed;
  const stars=won?(errors===0?3:errors<=2?2:1):0;
  G.result={won,stars,correct:G.correct,wrong:G.wrongCaught,missed:G.missed,coins:won?[0,30,45,60][stars]:5+Math.floor(G.correct/2),maxStreak:G.maxStreak,log:G.log.slice(),level:G.level,tutorial:G.tutorial};
}
function rotateMix(G){
  const pool=OWL.ARCADE.MIX_POOL;let j;do{j=G.R.pick(pool)}while(j===G.st.i);
  G.st={i:j,sub:LEVELS[j].setup(G.R,G.math)};
  for(const it of G.items)it.state="poof";      // старі хмаринки зникають без штрафу
  G.items.length=0;G.calm=null;G.pendingRotate=false;
  G.phase="splash";G.splashT=SPLASH;G.splashText="Нове правило! "+G.L.rule(G.st);G.spawnT=.3;
}
/* крок логіки. geom(it) → {catchable:boolean} для перевірки кошика; повертає список подій */
function step(G,dt,catchTest){
  const ev=[];if(G.ended)return ev;
  G.t+=dt;
  if(G.phase==="splash"){G.splashT-=dt;if(G.splashT<=0)G.phase="play";return ev}
  if(G.tutorial)return tutorialStep(G,dt,catchTest,ev);
  if(G.mode==="buttons")return calmStep(G,dt,ev);
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.items.length<(G.maxItems||4)){spawn(G);G.spawnT=G.fall*.42*(.85+G.R.f()*.3)}
  const sp=1/G.fall;
  /* обробляємо від найнижчої хмаринки: порядок однозначний */
  const order=G.items.slice().sort((a,b)=>b.p-a.p);
  for(const it of order){
    if(it.state!=="fall")continue;
    const prev=it.p;it.p+=dt*sp;it.age+=dt;
    if(it.p>=.96&&it.p<1.22&&catchTest(it)){it.state="caught";ev.push({type:it.ok?"good":"bad",it});if(record(G,it,it.ok?"caught-ok":"caught-wrong"))break;continue}
    if(it.p>=1.45){it.state="gone";if(it.ok){ev.push({type:"miss",it});if(record(G,it,"missed-ok"))break}else G.log.push({t:it.t,ok:false,why:it.why,rule:it.rule,outcome:"skipped-wrong"})}
  }
  G.items=G.items.filter(i=>i.state==="fall");
  if(!G.ended&&G.pendingRotate){rotateMix(G);ev.push({type:"rotate"})}
  return ev;
}
/* режим кнопок «Ловити / Пропустити» */
const CALM_TIME=10;
function calmStep(G,dt,ev){
  if(!G.calm){const it=makeItem(G,(()=>{let ok=G.R.chance(.5);if(G.sinceOk>=2)ok=true;G.sinceOk=ok?0:G.sinceOk+1;return ok})());it.nx=.5;G.items=[it];G.calm={it,t:0}}
  const c=G.calm;c.t+=dt;c.it.p=Math.min(.55,c.it.p+dt/1.2);
  if(G.calmTimer&&c.t>=CALM_TIME+1.2)ev.push(...calmAct(G,"skip",true));
  return ev;
}
function calmAct(G,act,timeout){
  const ev=[];if(G.ended||!G.calm||G.phase!=="play")return ev;
  const it=G.calm.it;G.calm=null;G.items=[];
  if(act==="catch"){ev.push({type:it.ok?"good":"bad",it});record(G,it,it.ok?"caught-ok":"caught-wrong")}
  else if(it.ok){ev.push({type:"miss",it,timeout});record(G,it,"missed-ok")}
  else{ev.push({type:"skipok",it});G.log.push({t:it.t,ok:false,why:it.why,rule:it.rule,outcome:"skipped-wrong"})}
  if(!G.ended&&G.pendingRotate){rotateMix(G);ev.push({type:"rotate"})}
  return ev;
}
/* навчання на двох хмаринках */
function tutorialStep(G,dt,catchTest,ev){
  const T=G.tut;
  if(!G.items.length){
    if(T.step===1){const it=makeItem(G,true,{t:"4 + 6",ok:true,why:"4 + 6 = 10"});it.nx=.5;G.items.push(it)}
    else{const a=makeItem(G,true,{t:"15 − 5",ok:true,why:"15 − 5 = 10"}),b=makeItem(G,false,{t:"3 · 4",ok:false,why:"3 · 4 = 12, а не 10"});
      const left=G.R.chance(.5);a.nx=left?.28:.72;b.nx=left?.72:.28;G.items.push(a,b)}
    for(const it of G.items)it.p=G.tutStartP||0;
  }
  const sp=1/9;
  for(const it of G.items){
    const prev=it.p;it.p+=dt*sp;
    if(it.p>=.96&&it.p<1.22&&catchTest(it)){
      if(it.ok){ev.push({type:"good",it});G.items=[];
        if(T.step===1){T.step=2;T.msg="Тепер сам: яка хмаринка дорівнює 10? Лови тільки її."}else{T.done=true;G.correct=1;finish(G,true)}return ev}
      ev.push({type:"bad",it,soft:true});T.msg=`${it.why}. Спробуй ще раз!`;G.items=[];return ev}
    if(it.p>=1.45){G.items=[];T.msg=it.ok?"Хмаринка пролетіла повз. Підведи кошик під «"+it.t+"»":"Добре, що не впіймав(ла) неправильну! Тепер лови правильну.";if(!it.ok&&T.step===2){}return ev}
  }
  return ev;
}

const FR_RE=/(√?\d*π|√?\d+)\/(\d+)/g;

function drawMath(ctx,t,x,y,fs){const parts=mathParts(t);if(parts.length===1&&parts[0].s!=null){ctx.font=`700 ${fs}px ${FONT}`;ctx.fillText(t,x,y);return}
  const W=mathWidth(ctx,t,fs);let cx=x-W/2;const al=ctx.textAlign;ctx.textAlign="left";
  for(const p of parts){if(p.s!=null){ctx.font=`700 ${fs}px ${FONT}`;ctx.fillText(p.s,cx,y);cx+=ctx.measureText(p.s).width}
    else{const f=fs*.85;ctx.font=`700 ${f}px ${FONT}`;const w=Math.max(ctx.measureText(p.n).width,ctx.measureText(p.d).width)+fs*.3;const mx=cx+w/2;ctx.textAlign="center";
      ctx.fillText(p.n,mx,y-f*.6);ctx.fillText(p.d,mx,y+f*.66);ctx.fillRect(cx+fs*.08,y-Math.max(1,fs*.05),w-fs*.16,Math.max(1.5,fs*.085));ctx.textAlign="left";cx+=w}}
  ctx.textAlign=al}

    const seq={ok:[[784,.08,"sine"],[1175,.16,"triangle"]],bad:[[247,.12,"triangle"],[196,.18,"triangle"]],miss:[[392,.1,"sine"]],rotate:[[523,.08,"sine"],[659,.08,"sine"],[523,.12,"sine"]],
      win:[[523,.1,"triangle"],[659,.1,"triangle"],[784,.1,"triangle"],[1047,.32,"triangle"]],lose:[[330,.16,"sine"],[262,.3,"sine"]],click:[[660,.05,"sine"]],coin:[[1318,.05,"square"],[1976,.09,"sine"]]}[type];
    let t=AC.currentTime;
    for(const [f,d,w] of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85}
  }catch(e){}
}

const modals=[];
function openModal({html,acts={},closable=true,wide=false,label="Діалог",onClose=null}){
  const back=document.createElement("div");back.className="modal-back";
  back.innerHTML=`<div class="modal${wide?" wide":""}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  const m={el:back,acts,closable,onClose,ret:document.activeElement};
  back.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]");
    if(b&&back.contains(b)){const f=m.acts[b.dataset.act];if(f){e.preventDefault();f(b,e)}return}
    if(e.target===back&&m.closable)closeModal();
  });
  back.addEventListener("input",e=>{const f=m.acts["@input"];if(f)f(e.target,e)});
  back.addEventListener("change",e=>{const f=m.acts["@change"];if(f)f(e.target,e)});
  back.addEventListener("submit",e=>{e.preventDefault();const f=m.acts["@submit"];if(f)f(e.target,e)});
  document.body.appendChild(back);modals.push(m);
  const first=back.querySelector("[autofocus]")||back.querySelector("button,input,select,textarea,[tabindex]");first&&first.focus();
  return m;
}
function closeModal(silent){
  const m=modals.pop();if(!m)return;m.el.remove();
  if(m.ret&&document.contains(m.ret))try{m.ret.focus()}catch(e){}

}

function flyCoins(fromEl,amount,startVal,baseDelay=0){
  const pill=$("#coinN")&&$("#coinN").closest(".pill");if(!pill||!amount)return;
  coinAnim++;coinShown=startVal;$("#coinN").textContent=coinShown;
  const fr=fromEl&&fromEl.getBoundingClientRect?fromEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const tr=pill.querySelector("svg").getBoundingClientRect();
  const fx=fr.left+fr.width/2,fy=fr.top+fr.height/2,tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
  const n=reduced()?1:Math.min(14,Math.max(5,Math.round(amount/3)));const end=startVal+amount;let got=0;
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="flycoin";d.innerHTML=IC.coin;document.body.appendChild(d);
    const ang=Math.random()*Math.PI*2,rad=30+Math.random()*50,mx=fx+Math.cos(ang)*rad,my=fy+Math.sin(ang)*rad-20;
    const dur=reduced()?10:700+Math.random()*250,delay=baseDelay+(reduced()?0:i*55);
    const an=d.animate([{transform:`translate(${fx-13}px,${fy-13}px) scale(.4)`,opacity:0},{transform:`translate(${mx-13}px,${my-13}px) scale(1.15) rotate(${(Math.random()-.5)*60}deg)`,opacity:1,offset:.35},{transform:`translate(${tx-13}px,${ty-13}px) scale(.7) rotate(0deg)`,opacity:1}],{duration:dur,delay,easing:"cubic-bezier(.45,.05,.4,1)",fill:"both"});
    an.onfinish=()=>{d.remove();got++;coinShown=got>=n?end:Math.round(startVal+amount*got/n);const c=$("#coinN");if(c)c.textContent=coinShown;
      pill.classList.remove("bump");void pill.offsetWidth;pill.classList.add("bump");if(got%3===1||got===n)sfx("coin");
      if(got>=n){coinAnim--;if(!coinAnim){coinShown=null;refreshBadges()}}};
  }
}

       <div class="top small"><span class="muted">${q.p} / ${q.goal}</span>${q.claimed?'<span class="tag good">Отримано</span>':`<button class="btn btn-forest" style="min-height:40px" data-act="claim" data-key="${q.key}" ${q.p>=q.goal?"":"disabled"}>Забрати</button>`}</div></div>`).join("")}
     <p class="small muted">Нові ${tab==="d"?"щоденні":"тижневі"} квести через ${h>=24?`${Math.floor(h/24)} д ${h%24} год`:`${h} год ${mi} хв`}.</p><button class="btn btn-ghost" data-act="close">Закрити</button>`);
  };
  m.acts={t:b=>{tab=b.dataset.v;render()},close:()=>closeModal(),
    claim:b=>{if(b.disabled)return;b.disabled=true;const r=ST.claimQuest(S,b.dataset.key,now());
      if(r.ok){const st=S.coins-r.coins;save();flyCoins(b,r.coins,st);toast(`+${r.coins} монет${r.gems?` і +${r.gems} ${r.gems===1?"кристал":r.gems<5?"кристали":"кристалів"}`:""}`);refreshBadges()}else if(r.reason==="stale")toast("Квести оновились — ось новий набір.");
      render()}};
  render();
}

/* ---------- АКАУНТ (вхід за поштою, без листа) ---------- */
function accountCard(){
  if(!CL||!CL.enabled)return `<div class="card"><h3>Акаунт</h3><p class="small muted">Вхід за поштою працює на сайті. Тут прогрес зберігається в цьому браузері.</p></div>`;
  return `<div class="card"><h3>Акаунт</h3><p>Ти граєш як <b>${esc(CL.user?CL.user.email:"гість")}</b>.</p><p class="small muted">Монети, зірки, скіни й завдання зберігаються за цією поштою. Введи її на будь-якому пристрої — і прогрес буде там.</p>
    <div class="btn-row"><button class="btn btn-ghost" data-act="logout">Змінити пошту</button></div></div>`;
}
function accountActs(){return{logout:()=>{CL.logout();if(!ADMIN_BUILD)ADMIN=false;ST.Store.useKey(ST.KEY);S=ST.Store.load();applyCosmetics();closeAllModals();go("home");openLoginGate()}}}
function openAccount(){const m=openModal({label:"Акаунт",html:accountCard()+`<button class="btn btn-quiet" data-act="close">Закрити</button>`,acts:{}});m.acts={close:()=>closeModal(),...accountActs()}}
function openLoginGate(){
  const m=openModal({label:"Вхід",closable:false,html:`<div class="gate"><p class="logo">Совиний <b>кошик</b></p><h2>Введи свою пошту</h2>
    <p class="muted">Прогрес — монети, зірки й скіни — збережеться за цією поштою. Наступного разу просто введи її знову, на будь-якому пристрої.</p>
    <form class="acc-form" data-form="login"><input type="email" id="accEmail" required autocomplete="email" inputmode="email" placeholder="твоя@пошта.com" aria-label="Пошта"><input type="password" id="accPass" autocomplete="current-password" placeholder="Пароль адміна" aria-label="Пароль адміна" hidden><button class="btn btn-primary btn-big" type="submit">Грати</button></form>
    <p class="err" id="accMsg" hidden></p></div>`,acts:{}});
  m.acts={"@submit":async f=>{const inp=f.querySelector("#accEmail"),msg=m.el.querySelector("#accMsg"),btn=f.querySelector("button");const email=(inp.value||"").trim().toLowerCase();
    if(!CL.validEmail(email)){msg.hidden=false;msg.textContent="Перевір пошту — схоже, в ній помилка.";inp.focus();return}
    btn.disabled=true;btn.textContent="Входжу…";msg.hidden=true;
    const pin=f.querySelector("#accPass");const fail=t=>{btn.disabled=false;btn.textContent="Грати";msg.hidden=false;msg.textContent=t};
    let isAdm=false;try{isAdm=await CL.isAdminEmail(email)}catch(e){}
    if(isAdm){if(pin.hidden||!pin.value){pin.hidden=false;pin.focus();return fail("Це пошта адміна — введи пароль.")}
      let ok=false;try{ok=await CL.adminLogin(email,pin.value)}catch(e){return fail("Не вдалося підключитися. Перевір інтернет і спробуй ще раз.")}
      if(!ok){pin.value="";pin.focus();return fail("Неправильний пароль.")}}
    let data=null;try{data=await CL.login(email)}catch(e){btn.disabled=false;btn.textContent="Грати";msg.hidden=false;msg.textContent="Не вдалося підключитися. Перевір інтернет і спробуй ще раз.";return}
    const uKey=ST.KEY+":"+email;let next=data?ST.validateV2(data):null;
    if(!next)next=ST.Store.peek(uKey);
    let firstHere=false;try{firstHere=!localStorage.getItem("owl-used-email");localStorage.setItem("owl-used-email","1")}catch(e){}
    if(!next)next=firstHere?S:ST.defaults();
    ST.Store.useKey(uKey);S=next;ST.Store.save(S);if(!data)CL.push(S,true);
    if(CL.admin)ADMIN=true;
    applyCosmetics();closeAllModals();go("home");toast(CL.admin?"Вхід адміна: режим тестування увімкнено":data?"З поверненням! Прогрес завантажено":"Готово! Прогрес зберігатиметься за цією поштою")}};
  setTimeout(()=>{const i=m.el.querySelector("#accEmail");if(i)i.focus()},50);
}
/* адмінка: гравці й статистика (як на matannmt) */
async function openPlayers(){
  const m=openModal({label:"Гравці",wide:true,html:`<h2>Гравці</h2><p class="muted">Завантажую…</p>`,acts:{close:()=>closeModal()}});
  let rows=[];try{rows=await CL.players()||[]}catch(e){setModalHtml(m,`<h2>Гравці</h2><p class="err">Не вдалося завантажити: ${esc(e.message)}</p><button class="btn btn-primary" data-act="close">Закрити</button>`);return}
  const L=ARCADE.LEVELS,now0=Date.now();
  const P=rows.map(r=>{const d=r.data||{},st=(d.arcade&&d.arcade.stars)||{};const vals=Object.values(st).map(Number);
    return{email:r.email,stars:vals.reduce((a,b)=>a+b,0),passed:vals.filter(v=>v>0).length,coins:+d.coins||0,skins:((d.cosm&&d.cosm.owned)||[]).length,st,at:new Date(r.updated_at).getTime()}});
  P.sort((a,b)=>b.stars-a.stars||b.at-a.at);
  const active=P.filter(p=>now0-p.at<7*864e5).length,avg=P.length?(P.reduce((a,p)=>a+p.passed,0)/P.length).toFixed(1):"0";
  const lvl=L.map((l,i)=>{const pass=P.filter(p=>(p.st[i]||0)>0);const s3=P.filter(p=>p.st[i]===3).length;return{i,name:l.name,pass:pass.length,avg:pass.length?(pass.reduce((a,p)=>a+p.st[i],0)/pass.length).toFixed(1):"—",s3}});
  const ago=t=>{const m0=Math.round((now0-t)/6e4);return m0<60?m0+" хв тому":m0<1440?Math.round(m0/60)+" год тому":Math.round(m0/1440)+" дн тому"};
  setModalHtml(m,`<h2>Гравці</h2>
   <div class="adm-kpi"><div><b>${P.length}</b><span>усього гравців</span></div><div><b>${active}</b><span>грали за 7 днів</span></div><div><b>${avg}</b><span>рівнів пройдено в середньому</span></div></div>
   <h3>Рейтинг гравців</h3><div class="adm-tbl"><table><thead><tr><th>#</th><th>Пошта</th><th>Зірки</th><th>Рівні</th><th>Монети</th><th>Скіни</th><th>Останній вхід</th></tr></thead><tbody>
   ${P.map((p,k)=>`<tr><td>${k+1}</td><td>${esc(p.email)}</td><td>${p.stars} / 36</td><td>${p.passed} / 12</td><td>${p.coins}</td><td>${p.skins}</td><td>${ago(p.at)}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">Поки немає гравців</td></tr>`}</tbody></table></div>
   <h3>Рівні</h3><div class="adm-tbl"><table><thead><tr><th>Рівень</th><th>Пройшли</th><th>Середньо зірок</th><th>На 3 зірки</th></tr></thead><tbody>
   ${lvl.map(l=>`<tr><td>${l.i+1}. ${esc(l.name)}</td><td>${l.pass} / ${P.length}</td><td>${l.avg}</td><td>${l.s3}</td></tr>`).join("")}</tbody></table></div>
   <button class="btn btn-primary" data-act="close">Закрити</button>`);
}
async function cloudBoot(){
  CL.init(ADMIN_BUILD);if(!CL.enabled)return;
  if(!CL.user){openLoginGate();return}
  ST.Store.useKey(ST.KEY+":"+CL.user.email);S=ST.Store.load();applyCosmetics();rerender();
  CL.adminRestore().then(ok=>{if(ok){ADMIN=true;if(screen!=="game")rerender()}});
  try{const data=await CL.load();const v=data?ST.validateV2(data):null;if(v){S=v;ST.Store.save(S);applyCosmetics();if(screen!=="game")rerender()}else CL.push(S,true)}catch(e){console.warn("cloud load",e.message)}
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  const m=openModal({label:"Налаштування",wide:true,html:"",acts:{}});
  const render=()=>{
    const st=S.settings;
    setModalHtml(m,`<h2>Налаштування</h2>
    ${ST.Store.corruptRaw?`<div class="notice bad"><div><b>Знайдено пошкоджене збереження.</b> Можна скопіювати його для відновлення або почати з чистого аркуша.<textarea class="io" readonly aria-label="Пошкоджене збереження">${esc(ST.Store.corruptRaw)}</textarea><div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" data-act="copyCorrupt">Копіювати</button><button class="btn btn-primary" data-act="discardCorrupt">Почати з чистого аркуша</button></div></div></div>`:""}
    <div class="card"><h3>Звук</h3><label class="small" for="vol">Гучність: ${Math.round(st.volume*100)}%</label><input type="range" id="vol" min="0" max="100" step="5" value="${Math.round(st.volume*100)}">
     <div class="btn-row"><button class="btn btn-ghost" data-act="mute" aria-pressed="${st.muted}">${st.muted?IC.mute+" Звук вимкнено":IC.sound+" Звук увімкнено"}</button></div></div>
    <div class="card"><h3>Рух і анімація</h3><div class="seg" role="group" aria-label="Рух">${[["system","Як у системі"],["reduce","Менше руху"],["full","Повна анімація"]].map(([k,n])=>`<button data-act="motion" data-v="${k}" aria-pressed="${st.motion===k}">${n}</button>`).join("")}</div>
     <p class="small muted">«Менше руху» вимикає тряску, частинки, конфеті й рух хмар на фоні.</p></div>
${accountCard()}
    <button class="btn btn-primary" data-act="close">Готово</button>`);
  };
  m.acts={close:()=>closeModal(),
    "@input":el=>{if(el.id==="vol"){S.settings.volume=+el.value/100;save();const l=m.el.querySelector('label[for="vol"]');if(l)l.textContent=`Гучність: ${el.value}%`}},
    "@change":el=>{if(el.id==="vol")sfx("click")},
    mute:()=>{S.settings.muted=!S.settings.muted;save();render()},
    motion:b=>{S.settings.motion=b.dataset.v;save();applyMotion();render()},
    ...accountActs(),
    reset:()=>openModal({label:"Скинути прогрес",html:`<h2>Скинути весь прогрес?</h2><p>Зірки, монети й оформлення буде видалено. Спершу можна зробити експорт.</p><div class="btn-row"><button class="btn btn-ghost" data-act="no" autofocus>Скасувати</button><button class="btn btn-primary" data-act="yes">Так, скинути</button></div>`,acts:{no:()=>closeModal(),yes:()=>{closeAllModals();S=ST.defaults();ST.Store.discardCorrupt();save();applyCosmetics();go("home");toast("Прогрес скинуто")}}}),
    copyCorrupt:()=>copyText(ST.Store.corruptRaw),
    discardCorrupt:()=>{ST.Store.discardCorrupt();save();render();toast("Починаємо з чистого аркуша. Поточний прогрес тепер зберігається.")}};
  render();
}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast("Скопійовано"),()=>toast("Не вдалося скопіювати — виділи текст вручну"))}catch(e){toast("Не вдалося скопіювати — виділи текст вручну")}}
function openExport(){
  const json=JSON.stringify(S);
  let url=null;try{url=URL.createObjectURL(new Blob([json],{type:"application/json"}))}catch(e){}
  openModal({label:"Експорт",wide:true,html:`<h2>Експорт прогресу</h2><p class="small muted">Збережи цей текст у файл або скопіюй. Потім його можна імпортувати.</p><textarea class="io" readonly id="expTxt" aria-label="Дані прогресу">${esc(json)}</textarea>
    <div class="btn-row"><button class="btn btn-primary" data-act="copy">Копіювати</button>${url?`<a class="btn btn-ghost" href="${url}" download="sovyniy-koshyk-progres.json">Завантажити файл</a>`:""}<button class="btn btn-ghost" data-act="close">Закрити</button></div>`,
    acts:{copy:()=>{const ta=$("#expTxt");ta.select();copyText(json)},close:()=>closeModal()},onClose:()=>{if(url)setTimeout(()=>URL.revokeObjectURL(url),1000)}});
}
function openImport(){
  const m=openModal({label:"Імпорт",wide:true,html:`<h2>Імпорт прогресу</h2><p class="small muted">Встав текст експорту або обери файл .json. Підтримуються збереження версій 1 і 2.</p>
    <label class="small" for="impFile">Файл</label><input type="file" id="impFile" accept=".json,application/json">
    <label class="small" for="impTxt">Або текст</label><textarea class="io" id="impTxt"></textarea><p class="err" id="impErr" hidden></p>
    <div class="btn-row"><button class="btn btn-ghost" data-act="close">Скасувати</button><button class="btn btn-primary" data-act="go">Перевірити</button></div>`,acts:{}});
  m.acts={close:()=>closeModal(),
    "@change":el=>{if(el.id==="impFile"&&el.files[0]){const r=new FileReader();r.onload=()=>{$("#impTxt").value=r.result};r.readAsText(el.files[0])}},
    go:()=>{const res=ST.parseImport($("#impTxt").value);const er=$("#impErr");if(!res.ok){er.hidden=false;er.textContent=res.err;return}
      openModal({label:"Підтвердження",html:`<h2>Замінити поточний прогрес?</h2><p>Файл версії ${res.from}: монет ${res.data.coins}, зірок ${Object.values(res.data.arcade.stars).reduce((a,b)=>a+b,0)}, записів у зошиті ${res.data.notebook.length}. Поточний прогрес буде замінено.</p><div class="btn-row"><button class="btn btn-ghost" data-act="no" autofocus>Скасувати</button><button class="btn btn-primary" data-act="yes">Замінити</button></div>`,
        acts:{no:()=>closeModal(),yes:()=>{closeAllModals();S=res.data;ST.Store.discardCorrupt();save();applyCosmetics();applyMotion();go("home");toast("Прогрес імпортовано")}}})}};
}
function openHelp(){openModal({label:"Як грати",html:`<h2>Як грати в аркаду</h2><ul><li>Рухай сову стрілками ← →, клавішами A / D, мишкою або пальцем.</li><li>Лови кошиком хмаринки, що відповідають правилу вгорі.</li><li>Неправильна хмаринка забирає сердечко. Три зірки — без помилок і пропусків.</li><li>Пауза — кнопка «Пауза», Esc або P.</li></ul><button class="btn btn-primary" data-act="close" autofocus>Зрозуміло</button>`,acts:{close:()=>closeModal()}})}

/* ---------------- input ---------------- */
const typing=el=>el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"||el.isContentEditable);
window.addEventListener("keydown",e=>{
  const m=topModal();
  if(m){
    if(e.key==="Escape"&&m.closable){e.preventDefault();closeModal();return}
    if(e.key==="Tab"){const f=[...m.el.querySelectorAll("button:not([disabled]),input,textarea,select,a[href],[tabindex]:not([tabindex='-1'])")];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}
    return;
  }
  if(typing(e.target))return;
  if(screen==="game"&&G){
    if(e.code==="ArrowLeft"||e.code==="KeyA"){keys.l=true;e.preventDefault()}
    if(e.code==="ArrowRight"||e.code==="KeyD"){keys.r=true;e.preventDefault()}
    if(e.code==="Escape"||e.code==="KeyP"){e.preventDefault();pauseGame()}
    if(G.phase==="splash"&&(e.code==="Space"||e.code==="Enter")){G.splashT=0;e.preventDefault()}
  }
});
window.addEventListener("keyup",e=>{if(e.code==="ArrowLeft"||e.code==="KeyA")keys.l=false;if(e.code==="ArrowRight"||e.code==="KeyD")keys.r=false});
function resetInput(){keys.l=keys.r=false;if(V)V.owl.target=null;activePointer=null}
let activePointer=null;
function initPointer(cv){
  const nxOf=e=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  cv.addEventListener("pointerdown",e=>{if(screen!=="game"||!G||G.mode==="buttons"||paused)return;activePointer=e.pointerId;V.owl.target=nxOf(e);try{cv.setPointerCapture(e.pointerId)}catch(_){} if(G.phase==="splash")G.splashT=0});
  cv.addEventListener("pointermove",e=>{if(screen!=="game"||!G||G.mode==="buttons"||paused)return;if(e.pointerType==="mouse"||activePointer===e.pointerId)V.owl.target=nxOf(e)});
  const end=e=>{if(activePointer===e.pointerId)activePointer=null};
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointercancel",e=>{end(e);resetInput()});
  cv.addEventListener("lostpointercapture",end);
}
window.addEventListener("blur",()=>{resetInput();if(screen==="game")pauseGame()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){resetInput();if(screen==="game")pauseGame()}});
window.addEventListener("resize",()=>{if(V)V.resize()});
window.addEventListener("orientationchange",()=>setTimeout(()=>V&&V.resize(),200));
if(mq.addEventListener)mq.addEventListener("change",applyMotion);

/* ---------------- main loop ---------------- */
function loop(t){
  const dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000))*(OWL.timeScale||1);lastFrame=t;
  try{
    if(G&&screen==="game"&&!paused){const ev=ARC.step(G,dt,V.catchTest);if(ev.length||G.ended)handleEvents(ev)}
    if(document.body.classList.contains("paper")){/* полотно приховане */}
    else{const still=screen==="shop";if(!still||!V._still){V.update(dt,screen==="game"?G:null,paused?{l:0,r:0}:keys);V.draw(screen==="game"?G:null)}V._still=still}
    frameUi();
    if(screen==="shop")tickPreviews(dt);
  }catch(err){console.error(err);showFatal(err)}
  requestAnimationFrame(loop);
}
let fatalShown=false;
function showFatal(err){if(fatalShown)return;fatalShown=true;openModal({label:"Помилка",html:`<h2>Щось пішло не так</h2><p>Раунд зупинено, але прогрес збережено.</p><p class="small muted">${esc(err&&err.message||err)}</p><button class="btn btn-primary" data-act="ok">На головну</button>`,acts:{ok:()=>{closeAllModals();fatalShown=false;go("home")}}})}

function boot(){
  V=ARC.Renderer($("#world"));applyCosmetics();V.resize();applyMotion();initPointer($("#world"));
  go("home");
  requestAnimationFrame(t=>{lastFrame=t;loop(t)});
  if(CL)cloudBoot();
}
/* тестові гачки */
OWL.UI={go,startRound,openQuests,openSettings,pauseGame,get G(){return G},get screen(){return screen},get V(){return V},setState:s=>{S=s},save,closeAllModals,handleEvents};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
